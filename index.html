<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El motor">
<title>El motor</title>
<style>
:root {
  --fondo: #f6f5f2; --tarjeta: #ffffff; --texto: #1b1b1b; --suave: #4a4a4a; --borde: #d9d6cf;
  --verde: #0d6b3a; --verde-fondo: #e3f3e9; --ambar: #7a4b00; --ambar-fondo: #fff1d6;
  --rojo: #a3191b; --rojo-fondo: #fde4e4; --gris-fondo: #ebebeb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
    --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
    --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
  }
}
:root[data-theme="dark"] {
  --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
  --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
  --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size: 15px; font-weight: 600; color: var(--suave); margin: 4px 0 12px; letter-spacing: .02em; }
.semaforo { border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 14px; border: 2px solid transparent; }
.semaforo .grande { font-size: 28px; font-weight: 700; line-height: 1.2; }
.semaforo .chico { font-size: 17px; margin-top: 6px; }
.ok { background: var(--verde-fondo); color: var(--verde); border-color: var(--verde); }
.ojo { background: var(--ambar-fondo); color: var(--ambar); border-color: var(--ambar); }
.alto { background: var(--rojo-fondo); color: var(--rojo); border-color: var(--rojo); }
.nada { background: var(--gris-fondo); color: var(--texto); border-color: var(--borde); }
.tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tarjeta .rotulo { font-size: 15px; color: var(--suave); }
.tarjeta .valor { font-size: 24px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.tarjeta .nota { font-size: 15px; color: var(--suave); margin-top: 2px; }
.ancha { grid-column: 1 / -1; }
.gana { color: var(--verde); } .pierde { color: var(--rojo); }
h2 { font-size: 17px; margin: 18px 0 8px; }
ul.ops { list-style: none; margin: 0; padding: 0; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; }
ul.ops li { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--borde); font-size: 15px; }
ul.ops li:first-child { border-top: 0; }
ul.ops .que { color: var(--suave); }
ul.ops .res { font-weight: 600; white-space: nowrap; }
.pie { font-size: 15px; color: var(--suave); margin-top: 16px; }
.pie p { margin: 6px 0; }
form.cuenta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; }
form.cuenta label { display: block; font-size: 17px; margin-bottom: 8px; }
form.cuenta input { width: 100%; font-size: 17px; padding: 14px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); }
.control { margin-bottom: 14px; }
.pc { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-size: 15px; }
.pc p { margin: 4px 0; } .pc .mal { color: var(--rojo); font-weight: 700; } .pc .bien { color: var(--verde); font-weight: 700; }
button.frenar { display: block; width: 100%; min-height: 88px; font: inherit; font-size: 22px; font-weight: 700; border: 0; border-radius: 16px; background: #a3191b; color: #fff; }
button.frenar:disabled { opacity: .55; }
button.otro, a.bolsa { display: block; width: 100%; min-height: 56px; font: inherit; font-size: 17px; font-weight: 700; border: 2px solid var(--borde); border-radius: 12px; background: var(--tarjeta); color: var(--texto); margin-top: 10px; text-align: center; text-decoration: none; }
a.bolsa { line-height: 52px; border-color: var(--rojo); color: var(--rojo); }
.aviso { border-radius: 14px; padding: 14px; font-size: 17px; border: 2px solid; margin-bottom: 10px; }
.aviso p { margin: 4px 0; } .aviso .chica { font-size: 15px; }
form.cuenta button { margin-top: 12px; width: 100%; min-height: 56px; font-size: 17px; font-weight: 700; border: 0; border-radius: 12px; background: var(--verde); color: var(--fondo); }
</style>
</head>
<body>
<main>
  <h1>EL MOTOR</h1>
  <div id="app"></div>
</main>
<script>
// Lee la cuenta en la API pública de Hyperliquid (la misma que usa su página). No tiene clave ni puede mandar órdenes.
// La dirección de la cuenta viaja en el enlace después de «#» (no se manda a ningún servidor ni queda escrita acá).
// EL BOTÓN «FRENAR TODO» (23/11/2026): si el enlace trae además «canal=», la página puede pedirle a la PC que frene
// (motor/control.mjs). Publica una palabra en ese canal privado de ntfy.sh; la PC saca las órdenes, cierra lo abierto y
// contesta por el mismo canal. No puede encender nada ni mover plata. El canal tampoco queda escrito acá.
const API = 'https://api.hyperliquid.xyz/info', NTFY = 'https://ntfy.sh', BOLSA = 'https://app.hyperliquid.xyz/trade';
const DEXES = ['io', 'xyz'];
const TOPE_DIA = 10, TOPE_TOTAL = 30, POSICION_MAX = 605, ORDENES_MAX = 14;
const app = document.getElementById('app');
const zona = { timeZone: 'America/Argentina/Buenos_Aires' };
const usd = (x) => (x <= -0.005 ? '−' : x >= 0.005 ? '+' : '') + Math.abs(x).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const plano = (x) => x.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const clase = (x) => (x > 0.005 ? 'gana' : x < -0.005 ? 'pierde' : '');
const hora = (t) => new Date(t).toLocaleTimeString('es-AR', { ...zona, hour: '2-digit', minute: '2-digit', hour12: false });
const haceCuanto = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.floor(m / 60)} h ${m % 60} min` : `hace ${Math.floor(m / 1440)} días`; };
const el = (tag, attrs = {}, ...hijos) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); for (const h of hijos) e.append(h); return e; };

function leerCuenta() {
  const p = new URLSearchParams(location.hash.slice(1));
  const c = (p.get('cuenta') || '').toLowerCase();
  if (/^0x[0-9a-f]{40}$/.test(c)) { try { localStorage.setItem('cuenta', c); } catch {} return c; }
  try { const g = localStorage.getItem('cuenta'); if (g && /^0x[0-9a-f]{40}$/.test(g)) return g; } catch {}
  return null;
}
async function pedir(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
  if (!r.ok) throw new Error('la bolsa contestó ' + r.status);
  return r.json();
}
function inicioDelDia() { const d = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); return Date.parse(d + 'T03:00:00Z'); }

function pedirCuenta() {
  app.replaceChildren();
  const input = el('input', { id: 'dir', inputmode: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '0x…' });
  const f = el('form', { class: 'cuenta' }, el('label', { for: 'dir' }, 'Pegá la dirección de tu cuenta de Hyperliquid'), input, el('button', { type: 'submit' }, 'Ver mi cuenta'));
  f.addEventListener('submit', (e) => { e.preventDefault(); const c = input.value.trim().toLowerCase(); if (/^0x[0-9a-f]{40}$/.test(c)) { location.hash = 'cuenta=' + c; arrancar(); } else input.focus(); });
  app.append(f);
}

// ---------- el control: preguntarle a la PC y frenar ----------
function leerCanal() {
  const ok = (c) => /^[A-Za-z0-9_-]{32,64}$/.test(c || '');
  const c = new URLSearchParams(location.hash.slice(1)).get('canal');
  if (ok(c)) { try { localStorage.setItem('canal', c); } catch {} return c; }
  try { const g = localStorage.getItem('canal'); if (ok(g)) return g; } catch {}
  return null;
}
const control = el('div', { class: 'control' });
const C = { pc: 'nada', r: null, cuando: 0, paso: 'listo', res: null, enviado: 0 };   // pc: nada | preguntando | contesta | callada · paso: listo | confirmar | esperando | hecho | sin-respuesta | sin-enviar
const sena = () => Math.random().toString(36).slice(2, 10);
async function publicar(canal, texto) {
  const r = await fetch(NTFY + '/' + canal, { method: 'POST', body: texto, cache: 'no-store' });
  if (!r.ok) throw new Error('el canal contestó ' + r.status);
}
async function esperarRespuesta(canal, que, id, segundos) {
  const fin = Date.now() + segundos * 1000;
  while (Date.now() < fin) {
    await esperar(2500);
    try {
      const r = await fetch(NTFY + '/' + canal + '/json?poll=1&since=3m', { cache: 'no-store' });
      for (const l of (await r.text()).split('\n')) { if (!l.trim()) continue; let e; try { e = JSON.parse(l); } catch { continue; } const m = String(e.message || ''); if (e.event !== 'message' || !m.startsWith('r:')) continue; let o; try { o = JSON.parse(m.slice(2)); } catch { continue; } if (o.que === que && o.id === id) return o; }
    } catch { /* sin señal: sigue probando */ }
  }
  return null;
}
let preguntando = false;
async function preguntarPC() {
  const canal = leerCanal(); if (!canal || preguntando) { pintarControl(); return; }
  preguntando = true; if (C.pc !== 'contesta') C.pc = 'preguntando'; pintarControl();
  const id = sena(); let r = null;
  try { await publicar(canal, 'estado ' + id); r = await esperarRespuesta(canal, 'estado', id, 25); } catch { /* sin señal */ }
  C.pc = r ? 'contesta' : 'callada'; C.r = r; C.cuando = Date.now(); preguntando = false; pintarControl();
}
async function frenarTodo() {
  const canal = leerCanal(); if (!canal) return;
  C.paso = 'esperando'; C.enviado = Date.now(); pintarControl();
  const id = sena();
  try { await publicar(canal, 'frenar ' + id); } catch { C.paso = 'sin-enviar'; pintarControl(); return; }
  const r = await esperarRespuesta(canal, 'frenar', id, 75);
  C.paso = r ? 'hecho' : 'sin-respuesta'; C.res = r; pintarControl();
  const c = leerCuenta(); if (c) actualizar(c);
}
function enLaBolsa() {
  return el('div', {},
    el('a', { class: 'bolsa', href: BOLSA, target: '_blank', rel: 'noopener' }, 'Frenar en la bolsa →'),
    el('p', { class: 'chica' }, 'Entrás con tu correo. Abajo: «Positions» → «Close All», y «Open Orders» → «Cancel All».'));
}
function pintarControl() {
  const canal = leerCanal(); control.replaceChildren(); if (!canal) return;
  const pc = el('div', { class: 'pc', role: 'status' });
  if (C.pc === 'preguntando' || C.pc === 'nada') pc.append(el('p', {}, 'Preguntándole a la PC…'));
  else if (C.pc === 'callada') pc.append(el('p', { class: 'mal' }, '✖ La PC no contesta'), el('p', {}, 'Puede estar apagada o sin internet. Si hay plata en juego, frená en la bolsa:'), enLaBolsa());
  else {
    const r = C.r, ps = r.programas || [];
    pc.append(el('p', { class: 'bien' }, '✔ La PC contesta (' + hora(C.cuando) + ')'));
    pc.append(el('p', {}, ps.length ? 'Operan: ' + ps.map((p) => String(p.m).split(':').pop() + (p.usd ? ' con ' + p.usd + ' USD' + (p.filas > 1 ? ' × ' + p.filas + ' filas' : '') + (p.vence ? ' hasta las ' + p.vence : '') : ' (sin tamaño: no pone órdenes)') + (p.parar ? ' — frenado' : '')).join('; ') + '.' : 'Ningún programa del motor está operando.'));
    if (r.claude && r.claude.ok === false) pc.append(el('p', { class: 'mal' }, '✖ Claude sin sesión desde las ' + r.claude.desde), el('p', {}, 'No recibe pedidos hasta que alguien escriba /login en la PC. El botón de acá abajo anda igual.'));
    else pc.append(el('p', {}, 'Claude: con sesión.'));
  }
  control.append(pc);
  if (C.paso === 'confirmar') {
    const si = el('button', { class: 'frenar', type: 'button' }, 'Sí, frenar todo'), no = el('button', { class: 'otro', type: 'button' }, 'No, dejar como está');
    si.addEventListener('click', frenarTodo); no.addEventListener('click', () => { C.paso = 'listo'; pintarControl(); });
    control.append(el('div', { class: 'aviso alto' }, el('p', {}, 'Saca todas las órdenes y cierra lo abierto al precio de ahora. El motor no vuelve a operar hasta que lo decidas.')), si, no);
    return;
  }
  if (C.paso === 'esperando') { control.append(el('div', { class: 'aviso ojo', role: 'status' }, el('p', {}, 'Pedido enviado a las ' + hora(C.enviado) + '. Esperando a la PC…'))); return; }
  if (C.paso === 'hecho') control.append(el('div', { class: 'aviso ' + (C.res.ok ? 'ok' : 'alto'), role: 'status' }, el('p', {}, (C.res.ok ? '✔ ' : '✖ ') + C.res.texto), ...(C.res.ok ? [] : [enLaBolsa()])));
  if (C.paso === 'sin-respuesta') control.append(el('div', { class: 'aviso alto', role: 'status' }, el('p', {}, '✖ La PC no contestó. El pedido quedó guardado: si la PC vuelve en las próximas 12 horas, frena sola. Mientras tanto:'), enLaBolsa()));
  if (C.paso === 'sin-enviar') control.append(el('div', { class: 'aviso alto', role: 'status' }, el('p', {}, '✖ No pude mandar el pedido (el celu no tiene señal o el canal no anda).'), enLaBolsa()));
  const b = el('button', { class: 'frenar', type: 'button' }, 'Frenar todo');
  b.addEventListener('click', () => { C.paso = 'confirmar'; pintarControl(); });
  control.append(b);
}

let ultimoBien = 0, timer = null, ocupado = false;
// Cada orden vive unos segundos (se pone y se saca siguiendo a la cuenta copiada): una sola mirada puede caer entre una
// y otra. Si no ve ninguna, mira dos veces más; y recuerda la última vez que vio órdenes puestas (20/11).
let ordenVista = 0;
try { ordenVista = Number(localStorage.getItem('ordenVista')) || 0; } catch { /* sin almacenamiento: empieza en 0 */ }
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
async function actualizar(cuenta) {
  if (ocupado) return; ocupado = true;
  try {
    // El motor opera en dos bolsas chicas (io y xyz): se leen las dos y se juntan.
    const leerOrdenes = async () => (await Promise.all(DEXES.map((dex) => pedir({ type: 'openOrders', user: cuenta, dex })))).flatMap((x) => (Array.isArray(x) ? x : []));
    let [perps, spot, ordenes, fills] = await Promise.all([
      Promise.all(DEXES.map((dex) => pedir({ type: 'clearinghouseState', user: cuenta, dex }))),
      pedir({ type: 'spotClearinghouseState', user: cuenta }),
      leerOrdenes(),
      pedir({ type: 'userFills', user: cuenta }),
    ]);
    const perp = { assetPositions: perps.flatMap((x) => x.assetPositions || []) };
    for (let i = 0; i < 2 && !ordenes.length; i++) { await esperar(1500); ordenes = await leerOrdenes(); }
    if (Array.isArray(ordenes) && ordenes.length) { ordenVista = Date.now(); try { localStorage.setItem('ordenVista', String(ordenVista)); } catch { /* */ } }
    ultimoBien = Date.now();
    pintar({ perp, spot, ordenes: Array.isArray(ordenes) ? ordenes : [], fills: Array.isArray(fills) ? fills : [] });
  } catch (e) {
    pintarError(e);
  } finally { ocupado = false; }
}

function pintar({ perp, spot, ordenes, fills }) {
  const hoy = inicioDelDia();
  const posiciones = (perp.assetPositions || []).map((x) => x.position);
  // Todos los mercados del dex: el motor puede cambiar de mercado (20/11: io:OAI y después io:PRL).
  const p = posiciones.find((x) => +x.szi !== 0);
  const abierta = posiciones.reduce((t, x) => t + +x.unrealizedPnl, 0);
  const valorPos = posiciones.reduce((t, x) => t + Math.abs(+x.positionValue), 0), tam = p ? +p.szi : 0;
  let dia = 0, total = 0, nDia = 0, ultima = 0, ultFill = null;
  for (const f of fills) { const n = +f.closedPnl - +f.fee; total += n; if (f.time >= hoy) { dia += n; nDia++; } if (f.time > ultima) { ultima = f.time; ultFill = f; } }
  const nuestras = ordenes;
  const operando = nuestras.length > 0 || Date.now() - ordenVista < 3 * 60000;
  // Si lo último fue cerrar tomando (el freno, un arranque o la salida de los 60 min) y no hay órdenes: puede ser la pausa
  // del freno, que dura 30 minutos desde el cierre.
  const pausa = !operando && !p && ultFill && ultFill.crossed && Date.now() - ultFill.time < 31 * 60000;
  const usdc = (spot.balances || []).find((b) => b.coin === 'USDC');
  const saldo = usdc ? +usdc.total : 0;
  const diaCon = dia + abierta, totalCon = total + abierta;

  let tipo, grande, chico;
  if (totalCon <= -TOPE_TOTAL) { tipo = 'alto'; grande = 'Parado: tocó el tope total'; chico = `Perdió ${plano(-totalCon)} en total. El programa paró solo y no vuelve a operar hasta que lo decidas. No hace falta hacer nada.`; }
  else if (diaCon <= -TOPE_DIA) { tipo = 'alto'; grande = 'Parado por hoy'; chico = `Hoy perdió ${plano(-diaCon)}. El programa frena solo hasta mañana. No hace falta hacer nada.`; }
  else if (valorPos > POSICION_MAX || nuestras.length > ORDENES_MAX) { tipo = 'alto'; grande = 'Algo raro: el guardián actúa'; chico = 'Hay más posición u órdenes de lo permitido. El guardián las saca solo y avisa a Claude.'; }
  else if (diaCon <= -0.7 * TOPE_DIA) { tipo = 'ojo'; grande = 'Atención: cerca del tope de hoy'; chico = `Hoy va ${usd(diaCon)}. Si llega a −${TOPE_DIA} USD, para solo.`; }
  else if (!fills.length && !nuestras.length) { tipo = 'nada'; grande = 'Todavía sin operar'; chico = 'La cuenta no tiene operaciones ni órdenes. Cuando el programa arranque, aparecen acá.'; }
  else if (pausa) { tipo = 'ok'; grande = 'En pausa, sin plata en juego'; chico = `A las ${hora(ultFill.time)} cerró todo. Si fue el freno, vuelve a operar solo a las ${hora(ultFill.time + 30 * 60000)}. Hoy va ${usd(diaCon)}.`; }
  else if (!operando && !tam && Date.now() - ultima > 30 * 60000) { tipo = 'ojo'; grande = `Quieto ${haceCuanto(ultima)}`; chico = 'Sin órdenes ni posición: no hay plata en juego. Puede estar parado por el cupo de pedidos o detenido; si el programa se cae, el guardián avisa.'; }
  else if (operando) { tipo = 'ok'; grande = 'Operando'; chico = `Hay órdenes puestas. Hoy va ${usd(diaCon)}. Topes: −${TOPE_DIA} USD por día y −${TOPE_TOTAL} en total.`; }
  else { tipo = 'ok'; grande = 'En orden'; chico = `Hoy va ${usd(diaCon)}. Topes: −${TOPE_DIA} USD por día y −${TOPE_TOTAL} en total.`; }

  const sem = el('div', { class: 'semaforo ' + tipo, role: 'status' }, el('div', { class: 'grande' }, grande), el('div', { class: 'chico' }, chico));
  const t = (rot, val, nota, cls = '', ancha = false) => el('div', { class: 'tarjeta' + (ancha ? ' ancha' : '') }, el('div', { class: 'rotulo' }, rot), el('div', { class: 'valor ' + cls }, val), ...(nota ? [el('div', { class: 'nota' }, nota)] : []));
  const tarjetas = el('div', { class: 'tarjetas' },
    t('Ganancia de hoy', usd(diaCon), nDia === 1 ? '1 operación' : `${nDia} operaciones`, clase(diaCon)),
    t('Ganancia total', usd(totalCon), fills.length >= 2000 ? 'de las últimas 2.000 operaciones' : 'desde que empezó', clase(totalCon)),
    t('Plata en la cuenta', plano(saldo), 'USDC'),
    t('Posición ahora', tam ? `${tam > 0 ? 'Compró' : 'Vendió'} ${plano(valorPos)}` : 'Ninguna', tam ? `resultado abierto ${usd(abierta)}` : 'todo cerrado'),
    t('Última operación', ultima ? haceCuanto(ultima) : '—', nuestras.length === 1 ? '1 orden puesta ahora' : `${nuestras.length} órdenes puestas ahora`, '', true),
  );
  const lista = el('ul', { class: 'ops' });
  const ult = fills.slice().sort((a, b) => b.time - a.time).slice(0, 10);
  if (!ult.length) lista.append(el('li', {}, el('span', { class: 'que' }, 'Sin operaciones todavía')));
  for (const f of ult) {
    const n = +f.closedPnl - +f.fee, monto = +f.px * +f.sz, donde = String(f.coin).split(':').pop();
    lista.append(el('li', {}, el('span', { class: 'que' }, `${hora(f.time)} · ${f.side === 'B' ? 'compró' : 'vendió'} ${plano(monto)} en ${donde}`), el('span', { class: 'res ' + clase(n) }, usd(n))));
  }
  const pie = el('div', { class: 'pie' },
    el('p', {}, `Actualizado a las ${hora(ultimoBien)}. Se actualiza solo cada 20 segundos.`),
    el('p', {}, 'El día va de 0 a 24 h de Buenos Aires. La ganancia de cada operación ya tiene la comisión descontada.'),
  );
  app.replaceChildren(sem, control, tarjetas, el('h2', {}, 'Últimas operaciones'), lista, pie);
}
function pintarError(e) {
  const viejo = ultimoBien ? ` Lo último que leí fue a las ${hora(ultimoBien)}.` : '';
  const sem = el('div', { class: 'semaforo nada', role: 'status' }, el('div', { class: 'grande' }, 'No puedo leer la cuenta'), el('div', { class: 'chico' }, `El celu no llega a Hyperliquid (${e.message}). Pruebo de nuevo solo.${viejo} El programa en la PC sigue igual.`));
  if (app.firstChild?.classList?.contains('semaforo')) app.firstChild.replaceWith(sem); else app.replaceChildren(sem, control);
}
function arrancar() {
  const cuenta = leerCuenta();
  if (!cuenta) { pedirCuenta(); return; }
  app.replaceChildren(el('div', { class: 'semaforo nada' }, el('div', { class: 'grande' }, 'Leyendo la cuenta…')), control);
  clearInterval(timer); actualizar(cuenta); timer = setInterval(() => actualizar(cuenta), 20000);
  preguntarPC();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const c = leerCuenta(); if (c) { actualizar(c); preguntarPC(); } } });
window.addEventListener('hashchange', arrancar);
arrancar();
</script>
