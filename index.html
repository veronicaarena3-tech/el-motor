<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El motor">
<title>El motor</title>
<style>
/* LA LETRA SIGUE A LA DEL TELÉFONO (regla de diseño 5, 24/11/2026). En el iPhone, «-apple-system-body» le da a la página
   el tamaño de letra que la persona eligió en Ajustes. La página lo mide y guarda en --u cuántas veces es la letra
   normal (17), con tope en el doble; todos los tamaños de letra salen de ahí. */
:root {
  --u: 1;
  --f15: calc(15px * var(--u)); --f17: calc(17px * var(--u)); --f22: calc(22px * var(--u)); --f24: calc(24px * var(--u)); --f28: calc(28px * var(--u));
  --fondo: #f6f5f2; --tarjeta: #ffffff; --texto: #1b1b1b; --suave: #4a4a4a; --borde: #d9d6cf;
  --verde: #0d6b3a; --verde-fondo: #e3f3e9; --ambar: #7a4b00; --ambar-fondo: #fff1d6;
  --rojo: #a3191b; --rojo-fondo: #fde4e4; --gris-fondo: #ebebeb;
  --frenar: #2f4050; --frenar-texto: #ffffff; --prueba: #5b2a86;
  --graf-gana: #008300; --graf-pierde: #e34948; --eje: #8a8780;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
    --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
    --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
    --frenar: #c9d6e2; --frenar-texto: #101418; --prueba: #d9c2ff;
    --graf-gana: #0ca30c; --graf-pierde: #e66767; --eje: #8a8780;
  }
}
:root[data-theme="dark"] {
  --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
  --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
  --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
  --frenar: #c9d6e2; --frenar-texto: #101418; --prueba: #d9c2ff;
  --graf-gana: #0ca30c; --graf-pierde: #e66767; --eje: #8a8780;
}
* { box-sizing: border-box; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
body { margin: 0; background: var(--fondo); color: var(--texto); font: var(--f17)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size: var(--f15); font-weight: 600; color: var(--suave); margin: 4px 0 12px; letter-spacing: .02em; }
/* EL ESTADO, EN UNA LÍNEA (28/11/2026, ella: «Está muy compleja la página del Motor»). En lugar de las tres luces (el motor,
   la PC y Claude): si todo anda, una línea («✔ Todo anda. No te toca nada.»); si algo falla, una caja por cada cosa que
   falla, con qué pasa y qué hacer. Lo que decían las luces abiertas está en «Ver más detalle». */
.estado { margin: 0 0 10px; }
.estado p.bien { font-size: var(--f17); font-weight: 600; line-height: 1.3; margin: 0 2px; overflow-wrap: anywhere; }
.estado p.bien.gris { color: var(--suave); font-weight: 400; }
.estado .luzdet:last-child { margin-bottom: 0; }
.luzdet { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid; }
.luzdet .tit { font-size: var(--f17); font-weight: 700; line-height: 1.25; }
.luzdet p { font-size: var(--f17); margin: 4px 0 0; color: var(--texto); }   /* lo que se lee de corrido va en la tinta del texto: 7 a 1 o más */
.ok { background: var(--verde-fondo); color: var(--verde); border-color: var(--verde); }
.ojo { background: var(--ambar-fondo); color: var(--ambar); border-color: var(--ambar); }
.alto { background: var(--rojo-fondo); color: var(--rojo); border-color: var(--rojo); }
.nada { background: var(--gris-fondo); color: var(--texto); border-color: var(--borde); }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tarjeta .rotulo { font-size: var(--f15); color: var(--suave); }
.tarjeta .valor { font-size: var(--f24); font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.tarjeta .nota { font-size: var(--f15); color: var(--suave); margin-top: 2px; }
.tarjeta .nota.fuerte { color: var(--texto); font-weight: 600; }
.ahora p { margin: 0; font-size: var(--f17); line-height: 1.4; }
.ahora p + p { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borde); }
.ahora b { font-weight: 700; }
.gana { color: var(--verde); } .pierde { color: var(--rojo); }
h2 { font-size: var(--f17); margin: 18px 0 8px; }
ul.ops { list-style: none; margin: 0; padding: 0; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; }
ul.ops li { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--borde); font-size: var(--f15); }
ul.ops li:first-child { border-top: 0; }
ul.ops .que { color: var(--suave); }
ul.ops .res { font-weight: 600; white-space: nowrap; }
ul.ops + button.otro { margin-top: 10px; }
/* QUÉ HACE CADA MERCADO (28/11): un renglón corto por mercado, el de Extended incluido. Lo que tiene plata en juego (órdenes
   o una posición) va arriba y en tinta; lo que está en pausa, abajo y en gris. Lo largo, en «Ver más detalle». */
ul.mercados li { flex-wrap: wrap; align-items: baseline; gap: 0 10px; font-size: var(--f17); line-height: 1.35; }
ul.mercados .que { flex: 1 1 12em; color: var(--texto); min-width: 0; }   /* si no entra en un renglón, se parte adentro y «hasta…» queda arriba a la derecha */
ul.mercados li.quieto .que { color: var(--suave); }
ul.mercados .cuando { margin-left: auto; font-size: var(--f15); color: var(--suave); white-space: nowrap; }
/* «Ver más detalle» (28/11): lo que sirve pero no hace falta mirar cada vez, plegado. */
.masdet { margin-top: 18px; }
.masdet > button.otro:first-child { margin-top: 0; }
.pie { font-size: var(--f17); color: var(--suave); margin-top: 16px; }   /* son frases: 17 (regla de diseño 5, 26/11) */
.pie p { margin: 6px 0; }
form.cuenta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; }
form.cuenta label { display: block; font-size: var(--f17); margin-bottom: 8px; }
form.cuenta input { width: 100%; min-height: 56px; font-size: var(--f17); padding: 14px; border-radius: 10px; border: 2px solid var(--suave); background: var(--fondo); color: var(--texto); }
/* Los hijos del control se acomodan como hijos de la página: así el botón grande puede quedarse pegado abajo de la
   pantalla mientras su lugar está más abajo de lo que se ve (con la letra grande), y en su lugar cuando se llega a él. */
.control { display: contents; }
.control > :last-child { margin-bottom: 14px; }
/* «Frenar todo» en reposo: chico (ella, 24/11/2026: «frenar más chico»). La zona que responde sigue midiendo 56. El de 88
   queda para el momento de decidir: «Sí, frenar todo» y «Frenar en la bolsa →». */
button.frenito { display: flex; align-items: center; justify-content: flex-start; min-height: 56px; min-width: 56px; padding: 0; border: 0; background: none; font: inherit; }
button.frenito > span { display: inline-flex; align-items: center; min-height: calc(38px * var(--u)); padding: 6px 16px; border-radius: 10px; background: var(--frenar); color: var(--frenar-texto); font-size: var(--f15); font-weight: 700; line-height: 1.2; }
button.frenito:active { box-shadow: none; }
button.frenito:active > span { box-shadow: inset 0 0 0 4px rgba(127, 127, 127, .55); }
/* El botón principal: 88 de alto (regla de diseño 4). Hay uno solo por momento. */
button.frenar, a.bolsa.principal { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 88px; padding: 8px 12px; font: inherit; font-size: var(--f22); font-weight: 700; line-height: 1.2; border: 0; border-radius: 16px; background: var(--frenar); color: var(--frenar-texto); text-align: center; text-decoration: none; margin-top: 10px; }
.control > button.frenar:first-of-type { margin-top: 0; }
.control > a.bolsa.principal { margin-top: 0; }
.control > p.como { margin: 6px 2px 0; color: var(--suave); }
.control > button.frenar, .control > a.bolsa.principal { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 2; box-shadow: 0 0 0 8px var(--fondo); }
button.otro, a.bolsa { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 8px 12px; font: inherit; font-size: var(--f17); font-weight: 700; line-height: 1.2; border: 2px solid var(--suave); border-radius: 12px; background: var(--tarjeta); color: var(--texto); margin-top: 10px; text-align: center; text-decoration: none; }
a.bolsa { border-color: var(--rojo); color: var(--rojo); }
a.bolsa.principal { border: 0; color: var(--frenar-texto); }
/* Cada toque se nota (regla de diseño 10). */
button:active, a.bolsa:active { box-shadow: inset 0 0 0 5px rgba(127, 127, 127, .55); }
.control > button.frenar:active, .control > a.bolsa.principal:active { box-shadow: 0 0 0 8px var(--fondo), inset 0 0 0 5px rgba(127, 127, 127, .55); }
.aviso { border-radius: 14px; padding: 14px; font-size: var(--f17); border: 2px solid; margin-bottom: 10px; }
.aviso p { margin: 4px 0; color: var(--texto); } .aviso .chica { font-size: var(--f17); }
.chica { font-size: var(--f17); }   /* «chica» quedó de nombre: lo que lleva son frases, y van en 17 (regla de diseño 5, 26/11) */
form.cuenta button { margin-top: 12px; width: 100%; min-height: 88px; font-size: var(--f22); font-weight: 700; border: 0; border-radius: 16px; background: var(--frenar); color: var(--frenar-texto); }
/* El gráfico: columnas por día, arriba lo ganado y abajo lo perdido. Cada columna lleva su número escrito. */
.graf { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 8px 10px; margin-bottom: 14px; }
.graf .sub { font-size: var(--f17); color: var(--suave); margin: 0 6px 10px; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.col .mas, .col .menos { display: flex; flex-direction: column; align-items: center; width: 100%; }
.col .mas { justify-content: flex-end; }
.col .menos { justify-content: flex-start; border-top: 1px solid var(--eje); }
.barra { width: min(24px, 56%); }
.mas .barra { background: var(--graf-gana); border-radius: 4px 4px 0 0; }
.menos .barra { background: var(--graf-pierde); border-radius: 0 0 4px 4px; }
.num { font-size: var(--f15); font-weight: 600; color: var(--texto); line-height: 1.35; white-space: nowrap; font-variant-numeric: tabular-nums; }
.col .dia { font-size: var(--f15); color: var(--suave); line-height: 1.2; text-align: center; margin-top: 6px; }
.col.hoy .dia { color: var(--texto); font-weight: 700; }
/* CADA DÍA SE TOCA (24/11/2026): la columna entera es el botón (56 o más de ancho: por eso entran menos días). El elegido
   lleva marco, no sólo color. Abajo se abre su detalle: por mercado, cómo cerró, comisiones y la ganancia hora por hora. */
button.col { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; padding: 2px 0 4px; background: none; border: 2px solid transparent; border-radius: 10px; font: inherit; color: inherit; text-align: center; cursor: pointer; }
button.col span { display: block; }
button.col[aria-pressed="true"] { border-color: var(--texto); background: var(--gris-fondo); }
.graf .toca { font-size: var(--f17); color: var(--suave); margin: 10px 6px 0; }
.det { margin: 12px 4px 0; padding-top: 10px; border-top: 1px solid var(--borde); }
.det h3 { font-size: var(--f17); margin: 0 2px 6px; }
.det p { margin: 6px 2px 0; }
.det ul.ops { border: 0; border-radius: 0; background: none; }
.det ul.ops li { padding: 9px 2px; }
.det ul.ops .que { color: var(--texto); }
.det .rot { font-size: var(--f15); color: var(--suave); margin: 12px 2px 0; }
.horas { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 6px 2px 0; }
.hcol { display: flex; flex-direction: column; min-width: 0; }
.hcol .mas, .hcol .menos { display: flex; flex-direction: column; align-items: center; width: 100%; }
.hcol .mas { justify-content: flex-end; }
.hcol .menos { justify-content: flex-start; border-top: 1px solid var(--eje); }
.hcol .barra { width: 70%; }
.heje { display: grid; grid-template-columns: repeat(4, 1fr); margin: 2px 2px 0; font-size: var(--f15); color: var(--suave); }
.sonido { margin-top: 18px; }
.sonido p { margin: 6px 2px 0; color: var(--suave); }
/* LO NUEVO (27/11/2026; ella: «Todo tiene que ser visible para mí en la app… Que sea user friendly. Clara» y «Prioridad: lo
   que tengo que hacer yo ahora»). «Te toca» va arriba de todo cuando hay algo que le toca a ella: UNA sola cosa, en una
   frase. No es un botón y no lleva el color de actuar (ese sigue siendo de «Frenar todo»): se distingue por el marco de
   tinta y la mano. Debajo, las tarjetas de lo nuevo. Nada de esto se mueve. */
.tetoca { background: var(--tarjeta); border: 3px solid var(--texto); border-radius: 16px; padding: 12px 14px 14px; margin: 0 0 12px; overflow-wrap: anywhere; }
.tetoca p { margin: 0; }
.tetoca .rot { font-size: var(--f17); font-weight: 700; }
.tetoca .que { font-size: var(--f22); font-weight: 700; line-height: 1.25; margin-top: 4px; }
.tetoca .como { font-size: var(--f17); margin-top: 6px; }
.tetoca .sigue { font-size: var(--f17); color: var(--suave); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borde); }
.tetoca .cuando { font-size: var(--f17); color: var(--suave); margin-top: 6px; }   /* es una frase: 17 */
.nov { overflow-wrap: anywhere; }
.nov p { margin: 0; font-size: var(--f17); line-height: 1.4; }
.nov p + p, .nov ul + p { margin-top: 8px; }
.nov p.rot { font-size: var(--f15); color: var(--suave); margin-top: 12px; }
.nov .gris, .tetoca .gris { color: var(--suave); }
.nov ul.ops { border: 0; border-radius: 0; background: none; }
.nov ul.ops li { padding: 9px 0; }
.nov ul.ops .que { color: var(--texto); }
p.viejo { font-size: var(--f17); color: var(--suave); margin: 0 0 8px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* Los pasos del camino: tilde y palabra (no sólo color), y de quién es cada uno. */
ul.pasos { list-style: none; margin: 8px 0 0; padding: 0; }
ul.pasos li { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; padding: 9px 0 9px 1.75em; border-top: 1px solid var(--borde); font-size: var(--f17); line-height: 1.3; }
ul.pasos .marca { position: absolute; left: 0; font-weight: 700; }
ul.pasos .paso { flex: 1 1 8em; min-width: 0; }
ul.pasos .quien { flex: 0 0 auto; margin-left: auto; font-size: var(--f15); color: var(--suave); }
ul.pasos li.a .paso { font-weight: 700; }
ul.pasos li.a .quien { font-weight: 700; color: var(--texto); }
ul.pasos li.h .marca { color: var(--verde); }
/* Lo que se fue mirando: plegado; se abre con un toque. El veredicto va con su signo y su palabra. */
ul.mirado { list-style: none; margin: 10px 0 0; padding: 0; }
ul.mirado li { padding: 10px 0; border-top: 1px solid var(--borde); font-size: var(--f17); line-height: 1.35; }
ul.mirado .nom { font-weight: 700; }
ul.mirado .ver { font-size: var(--f15); font-weight: 700; white-space: nowrap; }
ul.mirado .ver.v { color: var(--verde); } ul.mirado .ver.e { color: var(--ambar); } ul.mirado .ver.d { color: var(--suave); }
ul.mirado .ver.p { color: var(--prueba); }   /* «en prueba con plata»: violeta, que no es el color de actuar ni el de ganar o perder */
/* LOS TRES NÚMEROS (27/11 la mesa crítica; 28/11 más simple): la ganancia de hoy, la total y la plata. Cada número una sola
   vez, grande, con lo suyo chico debajo (el objetivo, el tope y las comisiones; lo que queda; dónde está la plata). Sólo
   plata de verdad: ningún número de papel va acá. */
.plata { padding: 2px 14px; margin-bottom: 10px; overflow-wrap: anywhere; }
.plata .fila { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; padding: 10px 0; border-top: 1px solid var(--borde); }
.plata .fila:first-child { border-top: 0; }
.plata .rot { font-size: var(--f17); }
.plata .val { margin-left: auto; font-size: var(--f24); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.plata .nota { flex: 1 0 100%; font-size: var(--f15); color: var(--suave); line-height: 1.35; margin-top: 2px; }
.plata .nota.fuerte { color: var(--texto); font-weight: 600; }
ul.mirado .por { display: block; margin-top: 2px; }
/* LA CARA (27/11/2026, ella: «Ponele reconocimiento facial a: Claude, el motor y remote desktop»). Con la llave de acceso del
   teléfono (Face ID). Protegida, al abrir y al volver después de 5 minutos fuera se ve UNA sola pantalla: una frase y el
   botón de 88 «Abrir con tu cara»; nada de datos atrás. Se prende y se saca abajo de todo, en el pie. */
.cara { padding-top: 6px; overflow-wrap: anywhere; }
.cara p { margin: 0 2px 14px; font-size: var(--f17); line-height: 1.4; }
.cara p.tit { font-size: var(--f22); font-weight: 700; line-height: 1.25; }
.cara p.mal { margin: 14px 2px 0; }
.cara button.frenar { margin-top: 0; }
.cara a.bolsa { margin-top: 14px; }
.carapie { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--borde); }
.carapie p.fuerte { color: var(--texto); font-weight: 600; }
/* Protegida y fuera de la pantalla: lo de adentro se tapa (por si el teléfono saca una foto para la lista de apps). */
body.tapado main { visibility: hidden; }
</style>

<body>
<main>
  <h1>EL MOTOR</h1>
  <div id="app"></div>
</main>
<script>
// Lee la cuenta en la API pública de Hyperliquid (la misma que usa su página). No tiene clave ni puede mandar órdenes.
// La dirección de la cuenta viaja en el enlace después de «#» (no se manda a ningún servidor ni queda escrita acá).
// EL BOTÓN «FRENAR TODO» (23/11/2026): si el enlace trae además «canal=», la página puede pedirle a la PC que frene
// (motor/control.mjs). Publica una palabra en ese canal privado de ntfy.sh; la PC saca las órdenes, cierra lo abierto y
// contesta por el mismo canal. No puede encender nada ni mover plata. El canal tampoco queda escrito acá.
// 24/11/2026: la letra sigue a la del teléfono, lo que se lee de corrido va en tinta oscura, el gráfico de la ganancia por día, y
// una campanita cuando la ganancia de hoy llega a un dólar más.
// 27/11/2026: LO NUEVO. Cuando la PC contesta «estado» manda además un bloque «novedades» (motor/celu-novedades.mjs): lo
// que le toca a ella ahora, el camino del lugar nuevo, la prueba en papel y lo que se fue mirando. Más abajo, «LO NUEVO».
// 28/11/2026: MÁS SIMPLE (ella: «Está muy compleja la página del Motor»). Arriba: «Te toca», el estado en una línea, tres
// números (ganancia de hoy, ganancia total, plata), «Frenar todo» y un renglón por mercado. Abajo: el gráfico, las últimas 3
// operaciones, «Ver más detalle» (todo lo demás, plegado: nada se borró salvo lo que se repetía), el sonido y la cara.
const API = 'https://api.hyperliquid.xyz/info', NTFY = 'https://ntfy.sh', BOLSA = 'https://app.hyperliquid.xyz/trade';
const DEXES = ['io', 'xyz'];
// 26/11/2026: el tope total es −45 (desde el 25/11) y el de órdenes se cuenta POR MERCADO (el motor opera hasta 6 a la
// vez): 3 filas por lado y la salida. Los frenos puestos en la bolsa no cuentan.
const TOPE_DIA = 10, TOPE_TOTAL = 45, POSICION_MAX = 605, ORDENES_MAX = 7;
const OBJETIVO_DIA = 30;   // 27/11 (mesa crítica): «Hoy con plata» se mide contra el objetivo de ella, 30 USD por día
const app = document.getElementById('app');
const zona = { timeZone: 'America/Argentina/Buenos_Aires' };
const usd = (x) => (x <= -0.005 ? '−' : x >= 0.005 ? '+' : '') + Math.abs(x).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const plano = (x) => x.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const clase = (x) => (x > 0.005 ? 'gana' : x < -0.005 ? 'pierde' : '');

// «FRENAR TODO» NO SE PIERDE POR LO QUE SE SUMA ARRIBA (lo de siempre no se rompe). Con la letra del teléfono muy grande,
// o en un teléfono chico, lo de arriba empujaría «Frenar todo» fuera de la primera pantalla. Ahí baja primero «Hoy con
// plata» y, si no alcanza, también «Te toca»: van justo debajo de «Frenar todo», en el mismo orden. Se mide una sola vez
// por cada tarjeta, letra y ancho (no en cada actualización), para que nada cambie de lugar solo mientras se lo lee.
const lugarArriba = { clave: '', plata: false, toca: false };   // true: va debajo de «Frenar todo»
function acomodarToca() {
  const t = tocaArriba.querySelector('.tetoca'), p = plataArriba.firstElementChild;
  if (!t && !p) return;
  const b = control.querySelector('button.frenito'), alto = window.innerHeight;
  if (!b || !b.isConnected || !b.firstElementChild || !(alto > 0)) return;   // sin dibujar (o tapado por la cara): no se mide   // el botón todavía no se dibujó: pintarControl llama de nuevo al final
  const fuera = () => b.firstElementChild.getBoundingClientRect().bottom + window.scrollY > alto;
  const clave = [t ? t.textContent : '', p ? p.childElementCount : 0, U, window.innerWidth, C.paso].join('|');
  if (lugarArriba.clave !== clave) {
    lugarArriba.clave = clave; lugarArriba.plata = lugarArriba.toca = false;
    if (p && fuera()) { plataAbajo.replaceChildren(p); lugarArriba.plata = true; }
    if (t && fuera()) { tocaAbajo.replaceChildren(t); lugarArriba.toca = true; }
    return;
  }
  if (lugarArriba.plata && p) plataAbajo.replaceChildren(p);
  if (lugarArriba.toca && t) tocaAbajo.replaceChildren(t);
}

// ---------- el sonido: una campanita cuando la ganancia de hoy llega a un dólar más ----------
// En la web no suena nada hasta el primer toque, y el iPhone en silencio la calla: por eso lo mismo queda escrito en la
// tarjeta «Ganancia de hoy» (el sonido nunca es la única señal). Tres notas que suben, cortas y suaves (medio segundo).
let audio = null, sonidoQuiere = true, sonidoPendiente = false;
try { sonidoQuiere = localStorage.getItem('sonido') !== 'no'; } catch { /* sin almacenamiento: queda prendido */ }
const sonidoListo = () => !!audio && audio.state === 'running';
function campanita(ctx, destino, t0) {
  const salida = ctx.createGain(); salida.gain.value = 0.2; salida.connect(destino);
  for (const [f, dt] of [[783.99, 0], [1046.5, 0.1], [1318.51, 0.2]]) {   // sol, do, mi: un acorde mayor que sube
    const a = t0 + dt, g = ctx.createGain(), o = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f * 0.985; o.frequency.setValueAtTime(f * 0.985, a); o.frequency.linearRampToValueAtTime(f, a + 0.03);   // entra con un barrido corto: una nota fija y pura suena a aparato
    o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.15;                                                                          // un poco de brillo, una octava arriba
    g.gain.value = 0; g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(1, a + 0.02); g.gain.exponentialRampToValueAtTime(0.001, a + 0.36);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(salida);
    o.start(a); o2.start(a); o.stop(a + 0.38); o2.stop(a + 0.38);
  }
}
function sonar() {
  if (!sonidoQuiere) return;
  if (!sonidoListo()) { sonidoPendiente = true; return; }   // suena en el primer toque
  sonidoPendiente = false;
  try { campanita(audio, audio.destination, audio.currentTime + 0.03); } catch { /* sin sonido: queda lo escrito */ }
}
async function despertarSonido() {
  try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); if (audio.state !== 'running') await audio.resume(); } catch { /* este navegador no tiene sonido */ }
  pintarSonido();
  return sonidoListo();
}
const sonido = el('div', { class: 'sonido' });
function pintarSonido() {
  const prendido = sonidoQuiere && sonidoListo();
  const b = el('button', { class: 'otro', type: 'button' }, prendido ? '🔕 Apagar el sonido' : '🔔 Activar el sonido');
  b.addEventListener('click', async () => {
    if (sonidoQuiere && sonidoListo()) { sonidoQuiere = false; sonidoPendiente = false; try { localStorage.setItem('sonido', 'no'); } catch {} pintarSonido(); return; }
    sonidoQuiere = true; try { localStorage.setItem('sonido', 'si'); } catch {}
    if (await despertarSonido()) sonar();   // al activarlo se escucha cómo suena
  });
  sonido.replaceChildren(b, el('p', { class: 'chica' }, 'Suena una campanita cuando hoy sube un dólar más.'));
}
// Cualquier toque fuera de los botones de frenar despierta el sonido (el navegador lo pide) y hace sonar lo que quedó pendiente.
document.addEventListener('click', async (e) => {
  if (!sonidoQuiere || sonidoListo() || e.target.closest?.('.control, .sonido, .cara, .carapie')) return;   // la cara: que nada gaste el toque que la llave necesita
  if (await despertarSonido() && sonidoPendiente) sonar();
}, true);
document.addEventListener('touchstart', () => {}, { passive: true });   // para que el iPhone marque el botón apretado
// Hasta qué dólar entero llegó hoy lo ganado y cerrado, y a qué hora. Suena una vez por cada dólar nuevo del día.
function dolarArriba(deHoy, dia) {
  let suma = 0, nivel = 0, cuando = 0;
  for (const f of deHoy) { suma += netoDe(f); const k = Math.floor(suma + 1e-9); if (k > nivel) { nivel = k; cuando = f.time; } }
  let visto = { dia, nivel: 0 };
  try { const g = JSON.parse(localStorage.getItem('dolar') || 'null'); if (g && g.dia === dia && g.nivel >= 0) visto = g; } catch { /* empieza en 0 */ }
  if (nivel > visto.nivel) { try { localStorage.setItem('dolar', JSON.stringify({ dia, nivel })); } catch {} sonar(); }
  return { nivel, cuando };
}

// LA PÁGINA LEE POCO (24/11): la bolsa cuenta las lecturas por conexión, y en casa el celu comparte la conexión con los
// programas del motor. Con el celu abierto los programas recibían rechazos (429). Por eso: se actualiza una vez por minuto,
// las órdenes puestas se miran cada dos minutos, y si la bolsa pide esperar, la página espera dos minutos sin insistir.
const CADA_MS = 60000, ORDENES_CADA_MS = 110000, ESPERA_429_MS = 120000;
let ultimoBien = 0, timer = null, ocupado = false, esperaHasta = 0, ordenesMem = [], ordenesT = 0, ultimoDato = null;
// Cada orden vive unos segundos (se pone y se saca siguiendo a la cuenta copiada): una sola mirada puede caer entre una
// y otra. Si no ve ninguna, mira dos veces más; y recuerda la última vez que vio órdenes puestas (20/11).
let ordenVista = 0;
try { ordenVista = Number(localStorage.getItem('ordenVista')) || 0; } catch { /* sin almacenamiento: empieza en 0 */ }
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- las operaciones, de a poco, y el libro de los días ----------
// La bolsa da como mucho 2.000 operaciones por pedido, en orden desde la hora pedida: las más nuevas no vienen (24/11).
// Por eso: (1) se lee por páginas; (2) los días ya terminados se guardan en el teléfono, sumados («el libro»), y al abrir
// sólo se lee desde el principio de hoy; (3) después, cada 30 s, sólo lo nuevo. Así la ganancia total y el gráfico no se
// quedan ciegos al pasar las 2.000, y cada lectura pesa poco (el límite de lecturas de la bolsa es por conexión).
let fillsMem = null, base = null, completo = true;   // base: { hasta, dias: { 'AAAA-MM-DD': [neto, operaciones] }, ult: [las últimas, por si hoy no hay] }
const claveLibro = (cuenta) => 'libro1:' + cuenta;
function cargarLibro(cuenta) {
  try { const g = JSON.parse(localStorage.getItem(claveLibro(cuenta)) || 'null'); if (g && g.hasta > 0 && g.dias && typeof g.dias === 'object') return { hasta: g.hasta, dias: g.dias, ult: Array.isArray(g.ult) ? g.ult : [] }; } catch { /* empieza de cero */ }
  return { hasta: 0, dias: {}, ult: [] };
}
// Las operaciones desde una hora (y, si se pide, hasta otra), por páginas. «entero» dice si llegó a leer todas.
async function traerEntre(cuenta, desde, hasta = 0) {
  const out = [], vistas = new Set(); let cursor = desde, entero = false;
  for (let pag = 0; pag < 30; pag++) {
    const f = await pedir(hasta ? { type: 'userFillsByTime', user: cuenta, startTime: cursor, endTime: hasta } : { type: 'userFillsByTime', user: cuenta, startTime: cursor });
    if (!Array.isArray(f)) break;
    let max = cursor;
    for (const x of f) { if (x.time > max) max = x.time; if (!vistas.has(x.tid)) { vistas.add(x.tid); out.push(x); } }
    if (f.length < 2000 || max === cursor) { entero = true; break; }
    cursor = max;
  }
  return { fills: out, entero };
}
async function traerDesde(cuenta, desde) {
  const r = await traerEntre(cuenta, desde);
  if (!r.entero) completo = false;   // quedaron páginas sin leer: lo sumado no es todo, y no se guarda como día terminado
  return r.fills;
}
async function leerFills(cuenta) {
  if (!fillsMem) { base = cargarLibro(cuenta); completo = true; fillsMem = await traerDesde(cuenta, base.hasta); return fillsMem; }
  const desde = fillsMem.reduce((m, f) => Math.max(m, f.time), base.hasta);
  const nuevas = await traerDesde(cuenta, desde);
  if (nuevas.length) { const vistas = new Set(fillsMem.map((f) => f.tid)); fillsMem = fillsMem.concat(nuevas.filter((f) => !vistas.has(f.tid))); }
  return fillsMem;
}
// Los días, sumados: los del libro más lo leído en esta apertura. Devuelve un Map en orden de fecha.
function sumarDias(fills) {
  const dias = new Map(Object.entries(base?.dias || {}).map(([d, v]) => [d, { g: +v[0] || 0, n: +v[1] || 0 }]));
  for (const f of fills) { const d = diaDe(f.time); if (!dias.has(d)) dias.set(d, { g: 0, n: 0 }); const x = dias.get(d); x.g += netoDe(f); x.n++; }
  return new Map([...dias].sort((a, b) => (a[0] < b[0] ? -1 : 1)));
}
function guardarLibro(cuenta, dias, ultimas, hoy) {
  if (!completo) return;
  const cerrados = {}; for (const [d, v] of dias) if (d < hoy) cerrados[d] = [Math.round(v.g * 1e6) / 1e6, v.n];
  const ult = ultimas.map((f) => ({ time: f.time, tid: f.tid, coin: f.coin, side: f.side, px: f.px, sz: f.sz, closedPnl: f.closedPnl, fee: f.fee, crossed: !!f.crossed }));
  try { localStorage.setItem(claveLibro(cuenta), JSON.stringify({ hasta: inicioDe(hoy), dias: cerrados, ult })); } catch { /* sin lugar: la próxima vez lee todo de nuevo */ }
}
async function actualizar(cuenta) {
  if (ocupado || Date.now() < esperaHasta) return; ocupado = true;
  try {
    // El motor opera en dos bolsas chicas (io y xyz): se leen las dos y se juntan.
    // frontendOpenOrders (24/11): pesa lo mismo que openOrders y dice cuáles son frenos en la bolsa (isTrigger) y cuál
    // es la salida (reduceOnly), así «Qué está haciendo» no las cuenta como órdenes para entrar.
    const leerOrdenes = async () => (await Promise.all(DEXES.map((dex) => pedir({ type: 'frontendOpenOrders', user: cuenta, dex })))).flatMap((x) => (Array.isArray(x) ? x : []));
    const tocaOrdenes = Date.now() - ordenesT >= ORDENES_CADA_MS;
    let [perps, spot, ordenes, fills] = await Promise.all([
      Promise.all(DEXES.map((dex) => pedir({ type: 'clearinghouseState', user: cuenta, dex }))),
      pedir({ type: 'spotClearinghouseState', user: cuenta }),
      tocaOrdenes ? leerOrdenes() : ordenesMem,
      leerFills(cuenta),
    ]);
    const perp = { assetPositions: perps.flatMap((x) => x.assetPositions || []) };
    // Sin órdenes a la vista se mira una vez más, y sólo si hace poco las hubo (24/11: antes miraba dos veces más siempre).
    if (tocaOrdenes && !ordenes.length && Date.now() - ordenVista < 3 * 60000) { await esperar(1500); ordenes = await leerOrdenes(); }
    if (tocaOrdenes) { ordenesMem = Array.isArray(ordenes) ? ordenes : []; ordenesT = Date.now(); }
    if (Array.isArray(ordenes) && ordenes.length) { ordenVista = Date.now(); try { localStorage.setItem('ordenVista', String(ordenVista)); } catch { /* */ } }
    ultimoBien = Date.now();
    ultimoDato = { cuenta, perp, spot, ordenes: Array.isArray(ordenes) ? ordenes : [], fills: Array.isArray(fills) ? fills : [] };
    pintar(ultimoDato);
  } catch (e) {
    if (/429/.test(String(e && e.message))) esperaHasta = Date.now() + ESPERA_429_MS;
    pintarError(e);
  } finally { ocupado = false; }
}

// ---------- el gráfico: la ganancia de cada día, en columnas ----------
const corto = (x) => { const a = Math.round(Math.abs(x) * 100) / 100; if (a < 0.005) return '0'; return (x < 0 ? '−' : '+') + a.toLocaleString('es-AR', a < 10 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : a < 100 ? { minimumFractionDigits: 1, maximumFractionDigits: 1 } : { maximumFractionDigits: 0 }); };
const diaLargo = (d) => new Date(inicioDe(d) + 12 * 3600e3).toLocaleDateString('es-AR', { ...zona, weekday: 'long' }) + ' ' + +d.slice(8) + '/' + +d.slice(5, 7);
const diaCorto = (d) => new Date(inicioDe(d) + 12 * 3600e3).toLocaleDateString('es-AR', { ...zona, weekday: 'short' }).replace('.', '');
// ---------- el detalle de un día: se toca su columna ----------
// Hoy sale de lo recién leído. Un día terminado se lee de la bolsa una sola vez (sus operaciones, por páginas) y su
// resumen queda guardado en el teléfono («detalle1:<cuenta>»): un día cerrado no cambia, y así no se gastan lecturas.
let diaElegido = null, grafAhora = null;   // grafAhora: con qué se dibujó el gráfico la última vez (para redibujarlo al tocar)
const detMem = new Map();                  // día → resumen · { leyendo: true } · { error: '…' }
const claveDet = (cuenta) => 'detalle1:' + cuenta;
const mercadoDe = (coin) => (String(coin).startsWith('#') ? 'Outcome' : String(coin).split(':').pop());
function resumir(fills) {
  const r = { n: 0, g: 0, com: 0, vol: 0, dej: 0, tom: 0, nTom: 0, mer: {}, horas: Array(24).fill(0) };
  for (const f of fills) {
    const neto = netoDe(f), m = mercadoDe(f.coin);
    r.n++; r.g += neto; r.com += +f.fee; r.vol += +f.px * +f.sz;
    if (f.crossed) { r.tom += neto; r.nTom++; } else r.dej += neto;
    const x = (r.mer[m] ??= [0, 0]); x[0] += neto; x[1]++;
    r.horas[new Date(f.time - 3 * 3600e3).getUTCHours()] += neto;
  }
  return r;
}
function detalleGuardado(cuenta, d) {
  try { const g = JSON.parse(localStorage.getItem(claveDet(cuenta)) || 'null'); const x = g && g[d]; if (x && x.n >= 0 && Array.isArray(x.horas) && x.horas.length === 24 && x.mer) return x; } catch { /* se lee de nuevo */ }
  return null;
}
function guardarDetalle(cuenta, d, det) {
  const r4 = (x) => Math.round(x * 1e4) / 1e4;
  try {
    const g = JSON.parse(localStorage.getItem(claveDet(cuenta)) || 'null') || {};
    g[d] = { n: det.n, g: r4(det.g), com: r4(det.com), vol: Math.round(det.vol), dej: r4(det.dej), tom: r4(det.tom), nTom: det.nTom, mer: Object.fromEntries(Object.entries(det.mer).map(([m, v]) => [m, [r4(v[0]), v[1]]])), horas: det.horas.map(r4) };
    localStorage.setItem(claveDet(cuenta), JSON.stringify(g));
  } catch { /* sin lugar: la próxima vez se lee de nuevo */ }
}
function detalleDe(cuenta, d, hoy) {
  const delDia = () => resumir((fillsMem || []).filter((f) => diaDe(f.time) === d));
  if (d === hoy) return delDia();
  if (detMem.has(d)) return detMem.get(d);
  const det = (base && completo && base.hasta <= inicioDe(d)) ? delDia() : detalleGuardado(cuenta, d);   // ya está en lo leído al abrir, o guardado
  if (det) detMem.set(d, det);
  return det;
}
async function leerDetalle(cuenta, d) {
  const pideEsperar = () => ({ error: `La bolsa pidió esperar. Tocá el día de nuevo después de las ${hora(esperaHasta)}.` });
  if (Date.now() < esperaHasta) { detMem.set(d, pideEsperar()); repintarGrafico(); return; }
  detMem.set(d, { leyendo: true }); repintarGrafico();
  try {
    const r = await traerEntre(cuenta, inicioDe(d), inicioDe(d) + 86400e3 - 1);
    const det = resumir(r.fills.filter((f) => diaDe(f.time) === d));
    if (r.entero) guardarDetalle(cuenta, d, det); else det.faltan = true;
    detMem.set(d, det);
  } catch (e) {
    if (/429/.test(String(e && e.message))) { esperaHasta = Date.now() + ESPERA_429_MS; detMem.set(d, pideEsperar()); }
    else detMem.set(d, { error: 'No pude leer ese día: el celu no llega a la bolsa. Tocá el día de nuevo para probar otra vez.' });
  }
  repintarGrafico();
}
function repintarGrafico(mostrar = false) {
  const viejo = document.querySelector('.graf'); if (!viejo || !grafAhora) return;
  viejo.replaceWith(grafico(grafAhora.dias, grafAhora.hoy, grafAhora.abierta, grafAhora.cuenta));
  if (mostrar) { document.querySelector('button.col[aria-pressed="true"]')?.focus({ preventScroll: true }); document.querySelector('.det')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function elegirDia(cuenta, d, hoy) {
  const m = detMem.get(d);
  if (diaElegido === d && !(m && m.error)) { diaElegido = null; repintarGrafico(); return; }   // tocar el mismo día lo cierra (si falló, prueba de nuevo)
  diaElegido = d; if (m && m.error) detMem.delete(d);
  if (detalleDe(cuenta, d, hoy)) repintarGrafico(true); else { leerDetalle(cuenta, d); repintarGrafico(true); }
}
// La ganancia hora por hora del día elegido: 24 columnas finas, arriba de la raya lo ganado y abajo lo perdido.
function porHora(horas) {
  const arriba = Math.max(0, ...horas), abajo = Math.max(0, ...horas.map((v) => -v));
  if (arriba + abajo < 0.005) return [];
  const k = 56 / (arriba + abajo), hMas = Math.max(1, Math.round(arriba * k)), hMenos = Math.round(abajo * k);
  const fila = el('div', { class: 'horas', role: 'img', 'aria-label': 'Hora por hora. ' + horas.map((v, h) => (Math.abs(v) >= 0.005 ? `${h} h: ${usd(v)}` : null)).filter(Boolean).join('. ') + '.' });
  for (const v of horas) {
    const mas = el('div', { class: 'mas', style: `height:${hMas}px` }), menos = el('div', { class: 'menos', style: `height:${hMenos}px` });
    const alto = Math.abs(v) < 0.005 ? 0 : Math.max(2, Math.round(Math.abs(v) * k));
    if (alto) (v > 0 ? mas : menos).append(el('div', { class: 'barra', style: `height:${alto}px` }));
    fila.append(el('div', { class: 'hcol' }, mas, menos));
  }
  const mejor = horas.indexOf(Math.max(...horas)), peor = horas.indexOf(Math.min(...horas)), lineas = [];
  if (horas[mejor] >= 0.005) lineas.push(el('p', { class: 'chica' }, `Mejor hora: de ${mejor} a ${mejor + 1}, `, el('b', { class: 'gana' }, usd(horas[mejor]))));
  if (horas[peor] <= -0.005) lineas.push(el('p', { class: 'chica' }, `Peor hora: de ${peor} a ${peor + 1}, `, el('b', { class: 'pierde' }, usd(horas[peor]))));
  return [el('p', { class: 'rot' }, 'Hora por hora'), fila, el('div', { class: 'heje', 'aria-hidden': 'true' }, ...[0, 6, 12, 18].map((h) => el('span', {}, h + ' h'))), ...lineas];
}
function panelDetalle(cuenta, x, hoy, abiertaHoy) {
  const d = x.d, det = detalleDe(cuenta, d, hoy), nombre = diaLargo(d);
  const caja = el('div', { class: 'det' }, el('h3', {}, `${d === hoy ? 'Hoy, ' + nombre : nombre[0].toUpperCase() + nombre.slice(1)}: ${usd(x.g)}`));
  const cerrar = el('button', { class: 'otro', type: 'button' }, 'Cerrar el detalle');
  cerrar.addEventListener('click', () => { diaElegido = null; repintarGrafico(); });
  if (!det || det.leyendo) { caja.append(el('p', { class: 'chica', role: 'status' }, 'Leyendo las operaciones de ese día…'), cerrar); return caja; }
  if (det.error) { caja.append(el('p', { class: 'chica', role: 'status' }, det.error), cerrar); return caja; }
  if (!det.n) { caja.append(el('p', { class: 'chica' }, 'Ese día no hubo operaciones.'), cerrar); return caja; }
  const fila = (que, cuanto, cls = '') => el('li', {}, el('span', { class: 'que' }, que), el('span', { class: 'res ' + cls }, cuanto));
  const veces = (n, uno, muchos) => (n === 1 ? '1 ' + uno : `${n.toLocaleString('es-AR')} ${muchos}`);
  const lista = el('ul', { class: 'ops' });
  for (const [m, v] of Object.entries(det.mer).sort((a, b) => Math.abs(b[1][0]) - Math.abs(a[1][0]))) lista.append(fila(`${m} · ${veces(v[1], 'operación', 'operaciones')}`, usd(v[0]), clase(v[0])));
  if (d === hoy && Math.abs(abiertaHoy) >= 0.005) lista.append(fila('Lo que está abierto ahora', usd(abiertaHoy), clase(abiertaHoy)));
  const como = el('ul', { class: 'ops' }, fila('Con órdenes que esperan', usd(det.dej), clase(det.dej)));
  if (det.nTom) como.append(fila(`Cerrando al precio del momento (frenos y salidas) · ${veces(det.nTom, 'vez', 'veces')}`, usd(det.tom), clase(det.tom)));
  como.append(fila('Comisiones (ya descontadas)', plano(det.com)), fila('Operó en total', Math.round(det.vol).toLocaleString('es-AR') + ' USD'));
  caja.append(el('p', { class: 'rot' }, 'Por mercado'), lista, el('p', { class: 'rot' }, 'Cómo salió'), como, ...porHora(det.horas));
  if (det.faltan) caja.append(el('p', { class: 'chica' }, 'Faltan operaciones de ese día: la bolsa no las dio todas.'));
  caja.append(cerrar);

  const b = el('button', { class: 'frenar', type: 'button' }, 'Abrir con tu cara');
  b.addEventListener('click', abrirConCara);
  caja.append(b);
  if (esperando) caja.append(el('p', { class: 'mal', role: 'status' }, 'Esperando tu cara…'));
  else if (CARA.fallas === 1) caja.append(el('p', { class: 'mal', role: 'status' }, '✖ No te reconoció. Tocá de nuevo «Abrir con tu cara».'));
  else if (CARA.fallas >= 2) caja.append(el('p', { class: 'mal', role: 'status' }, '✖ No te reconoció otra vez. Si no te abre, abrí tu enlace secreto del motor en Safari: ahí no pide la cara.'), el('a', { class: 'bolsa', href: BOLSA, target: '_blank', rel: 'noopener' }, 'Frenar en la bolsa →'));
  app.replaceChildren(caja);
}
function cerrarConCara() {
  CARA.cerrada = true; CARA.fallas = 0; CARA.ocupada = false;
  clearInterval(timer); timer = null;   // cerrada no lee nada: ni la cuenta ni la PC
  document.body.classList.remove('tapado');
  try { window.scrollTo(0, 0); } catch { /* */ }
  pintarCandado();
}
async function abrirConCara() {
  if (CARA.ocupada || Date.now() - CARA.toque < 700) return;   // un segundo toque seguido no cuenta (regla de diseño 4)
  CARA.toque = Date.now(); CARA.ocupada = true; pintarCandado(true);
  let bien = false; try { bien = !!CARA.llave && await probarLlave(CARA.llave.id); } catch { bien = false; }
  CARA.ocupada = false;
  if (!CARA.cerrada) return;
  if (bien) { CARA.cerrada = false; CARA.fallas = 0; arrancar(); return; }
  CARA.fallas++; pintarCandado();
}
// Abajo de todo: prenderla, probarla (si hizo falta otro toque) o sacarla. Lo que es y lo que no, dicho como es.
const CARA_HONESTO = 'Frena a quien tenga tu teléfono desbloqueado en la mano. No cifra nada ni reemplaza a tu enlace secreto: abierto en Safari o en otro teléfono, no la pide.';
function pintarCaraPie() {
  const linea = (t, fuerte = false) => el('p', fuerte ? { class: 'fuerte', role: 'status' } : {}, t);
  const boton = (t, fn) => { const x = el('button', { class: 'otro', type: 'button' }, t); x.addEventListener('click', fn); return x; };
  let partes = [];
  if (CARA.ocupada) partes = [linea('Esperando tu cara…', true)];
  // 28/11: un botón y UNA línea. Lo que es y lo que no (CARA_HONESTO) quedó en «Ver más detalle», «Cómo funciona».
  else if (CARA.llave) partes = [linea(CARA.aviso || '🔒 Protegida con tu cara: la pide al abrir y al volver después de 5 minutos.', true), boton('Dejar de pedir la cara', dejarLaCara)];
  else if (CARA.paso === 'probar') partes = [linea('La llave está creada. Falta probarla una vez con tu cara.', true), boton('Probar con tu cara', probarNueva)];
  else if (CARA.puede === false) partes = [linea('Este teléfono no deja proteger la página con tu cara: sigue como hoy.')];
  else if (CARA.puede) partes = [...(CARA.aviso ? [linea(CARA.aviso, true)] : []), boton('Proteger con tu cara', protegerConCara), linea('Pide tu cara al abrir y al volver después de 5 minutos.')];
  caraPie.replaceChildren(...partes);
  pintarMas();   // «Cómo funciona» dice lo de la cara sólo si este teléfono puede usarla
}
function quedarProtegida(id) {
  const g = { id, t: Date.now() };
  try { localStorage.setItem(CLAVE_CARA, JSON.stringify(g)); } catch { /* sin lugar */ }
  CARA.paso = ''; CARA.nueva = null;
  if (leerLlave()?.id === id) { CARA.llave = g; CARA.aviso = '✔ Listo: la página pide tu cara al abrir y al volver después de 5 minutos.'; }
  else CARA.aviso = '✖ Este teléfono no deja guardar que la página está protegida: sigue sin pedir la cara.';
}
async function protegerConCara() {
  if (CARA.ocupada || Date.now() - CARA.toque < 700) return;
  CARA.toque = Date.now(); CARA.ocupada = true; CARA.aviso = ''; CARA.paso = ''; pintarCaraPie();
  let id = null; try { id = await crearLlave(); } catch { id = null; }
  if (!id) { CARA.ocupada = false; CARA.aviso = '✖ No se pudo crear la llave: la página sigue como antes. Podés probar de nuevo.'; pintarCaraPie(); return; }
  // La prueba, en el mismo toque. Si el teléfono pide otro toque para esto, se lo pide a ella.
  let bien = false; try { bien = await probarLlave(id); } catch { bien = false; }
  CARA.ocupada = false;
  if (bien) quedarProtegida(id); else { CARA.paso = 'probar'; CARA.nueva = id; }
  pintarCaraPie();
}
async function probarNueva() {
  if (CARA.ocupada || !CARA.nueva || Date.now() - CARA.toque < 700) return;
  CARA.toque = Date.now(); CARA.ocupada = true; CARA.aviso = ''; pintarCaraPie();
  let bien = false; try { bien = await probarLlave(CARA.nueva); } catch { bien = false; }
  CARA.ocupada = false;
  if (bien) quedarProtegida(CARA.nueva);
  else { CARA.paso = ''; CARA.nueva = null; CARA.aviso = '✖ No se pudo probar la llave: la página sigue sin pedir la cara. Podés probar de nuevo.'; }
  pintarCaraPie();
}
async function dejarLaCara() {
  if (CARA.ocupada || !CARA.llave || Date.now() - CARA.toque < 700) return;
  CARA.toque = Date.now(); CARA.ocupada = true; CARA.aviso = ''; pintarCaraPie();
  let bien = false; try { bien = await probarLlave(CARA.llave.id); } catch { bien = false; }
  CARA.ocupada = false;
  if (!bien) CARA.aviso = '✖ No te reconoció: la página sigue pidiendo la cara.';
  else {
    const id = CARA.llave.id;
    try { localStorage.removeItem(CLAVE_CARA); } catch { /* */ }
    if (leerLlave()) CARA.aviso = '✖ No se pudo sacar: la página sigue pidiendo la cara.';
    else {
      CARA.llave = null; CARA.aviso = '✔ Listo: la página ya no pide la cara.';
      // Si el teléfono lo sabe hacer, que también borre esa llave de sus contraseñas (sin preguntar nada; si no, queda ahí sin uso).
      try { const p = window.PublicKeyCredential?.signalUnknownCredential?.({ rpId: location.hostname, credentialId: id }); if (p && p.catch) p.catch(() => {}); } catch { /* no lo sabe hacer */ }
    }
  }
  pintarCaraPie();
}

function arrancar() {
  if (CARA.cerrada) { pintarCandado(); return; }   // protegida con la cara: primero la cara
  U = medirLetra();
  const cuenta = leerCuenta();
  if (!cuenta) { pedirCuenta(); return; }
  L.motor = { tipo: 'nada', corto: 'Leyendo', titulo: 'Leyendo la cuenta…', texto: [] };
  cargarNovedades();   // lo último que dijo la PC, guardado en el teléfono: se ve enseguida, con su hora
  app.replaceChildren(tocaArriba, estadoEl, plataArriba, control, tocaAbajo, plataAbajo, mercadosEl, mas); pintarNovedades();
  fillsMem = null; ultimoDato = null;
  ordenesT = 0; ordenesMem = [];
  clearInterval(timer); actualizar(cuenta); timer = setInterval(() => actualizar(cuenta), CADA_MS);
  preguntarPC();
}
// Al volver a la página: si está protegida y estuvo 5 minutos o más fuera, pide la cara; si no, lee de nuevo como siempre.
// Mientras está fuera, protegida, lo de adentro se tapa (por si el teléfono saca una foto para la lista de apps).
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { CARA.oculta = Date.now(); if (CARA.llave && !CARA.cerrada) document.body.classList.add('tapado'); return; }
  document.body.classList.remove('tapado');
  if (CARA.cerrada) return;
  if (CARA.llave && CARA.oculta && Date.now() - CARA.oculta >= CARA_FUERA_MS) { cerrarConCara(); return; }
  const c = leerCuenta(); if (c) { actualizar(c); preguntarPC(); }
});
window.addEventListener('pagehide', () => { CARA.oculta = Date.now(); });
window.addEventListener('pageshow', (e) => { if (e.persisted && CARA.llave && !CARA.cerrada && CARA.oculta && Date.now() - CARA.oculta >= CARA_FUERA_MS) cerrarConCara(); });
window.addEventListener('hashchange', arrancar);
// Al abrir: si está protegida, primero la cara (nada se lee ni se dibuja antes). Después se averigua si el teléfono puede.
CARA.llave = leerLlave();
if (CARA.llave) cerrarConCara(); else arrancar();
puedeCara().then((p) => { CARA.puede = p; pintarCaraPie(); });
</script>
