<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El motor">
<title>El motor</title>
<style>
/* LA LETRA SIGUE A LA DEL TELÉFONO (regla de diseño 5, 24/11/2026). En el iPhone, «-apple-system-body» le da a la página
   el tamaño de letra que la persona eligió en Ajustes. La página lo mide y guarda en --u cuántas veces es la letra
   normal (17), con tope en el doble; todos los tamaños de letra salen de ahí. */
:root {
  --u: 1;
  --f15: calc(15px * var(--u)); --f17: calc(17px * var(--u)); --f22: calc(22px * var(--u)); --f24: calc(24px * var(--u)); --f28: calc(28px * var(--u));
  --fondo: #f6f5f2; --tarjeta: #ffffff; --texto: #1b1b1b; --suave: #4a4a4a; --borde: #d9d6cf;
  --verde: #0d6b3a; --verde-fondo: #e3f3e9; --ambar: #7a4b00; --ambar-fondo: #fff1d6;
  --rojo: #a3191b; --rojo-fondo: #fde4e4; --gris-fondo: #ebebeb;
  --frenar: #2f4050; --frenar-texto: #ffffff;
  --graf-gana: #008300; --graf-pierde: #e34948; --eje: #8a8780;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
    --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
    --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
    --frenar: #c9d6e2; --frenar-texto: #101418;
    --graf-gana: #0ca30c; --graf-pierde: #e66767; --eje: #8a8780;
  }
}
:root[data-theme="dark"] {
  --fondo: #121212; --tarjeta: #1e1e1e; --texto: #f2f2f2; --suave: #c4c4c4; --borde: #3a3a3a;
  --verde: #7fdca6; --verde-fondo: #12301f; --ambar: #ffcf70; --ambar-fondo: #3a2a07;
  --rojo: #ff9a9a; --rojo-fondo: #3d1414; --gris-fondo: #2a2a2a;
  --frenar: #c9d6e2; --frenar-texto: #101418;
  --graf-gana: #0ca30c; --graf-pierde: #e66767; --eje: #8a8780;
}
* { box-sizing: border-box; }
html { font-size: 106.25%; -webkit-text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
body { margin: 0; background: var(--fondo); color: var(--texto); font: var(--f17)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size: var(--f15); font-weight: 600; color: var(--suave); margin: 4px 0 12px; letter-spacing: .02em; }
/* LAS LUCES (24/11/2026, ella: «el mega botón "operando", que sea sólo un botón pequeño verde, idem pc y claude»): un botón
   chico por cosa —el motor, la PC y Claude—. Verde es «en orden». Tocás uno y abre su detalle; lo rojo se abre solo.
   La zona que responde mide 56 (regla de diseño 4): el botón es transparente y lo que se ve es la píldora de adentro. */
.luces { display: flex; flex-wrap: wrap; gap: 0 6px; margin: -8px 0 2px; }
button.luz { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; min-width: 56px; padding: 0; border: 0; background: none; font: inherit; color: inherit; }
button.luz > span { display: inline-flex; align-items: center; min-height: calc(34px * var(--u)); padding: 4px 14px; border: 2px solid; border-radius: 999px; font-size: var(--f15); font-weight: 700; line-height: 1.2; white-space: nowrap; }
button.luz[aria-expanded="true"] > span { box-shadow: 0 0 0 3px var(--borde); }
button.luz:active { box-shadow: none; }
button.luz:active > span { box-shadow: inset 0 0 0 4px rgba(127, 127, 127, .55); }
.luzdet { border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid; }
.luzdet .tit { font-size: var(--f17); font-weight: 700; line-height: 1.25; }
.luzdet p { font-size: var(--f17); margin: 4px 0 0; color: var(--texto); }   /* lo que se lee de corrido va en la tinta del texto: 7 a 1 o más */
.ok { background: var(--verde-fondo); color: var(--verde); border-color: var(--verde); }
.ojo { background: var(--ambar-fondo); color: var(--ambar); border-color: var(--ambar); }
.alto { background: var(--rojo-fondo); color: var(--rojo); border-color: var(--rojo); }
.nada { background: var(--gris-fondo); color: var(--texto); border-color: var(--borde); }
.tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(132px * var(--u))), 1fr)); gap: 10px; margin-bottom: 14px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tarjeta .rotulo { font-size: var(--f15); color: var(--suave); }
.tarjeta .valor { font-size: var(--f24); font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.tarjeta .nota { font-size: var(--f15); color: var(--suave); margin-top: 2px; }
.tarjeta .nota.fuerte { color: var(--texto); font-weight: 600; }
.ancha { grid-column: 1 / -1; }
.ahora p { margin: 0; font-size: var(--f17); line-height: 1.4; }
.ahora p + p { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borde); }
.ahora b { font-weight: 700; }
.gana { color: var(--verde); } .pierde { color: var(--rojo); }
h2 { font-size: var(--f17); margin: 18px 0 8px; }
ul.ops { list-style: none; margin: 0; padding: 0; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; }
ul.ops li { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--borde); font-size: var(--f15); }
ul.ops li:first-child { border-top: 0; }
ul.ops .que { color: var(--suave); }
ul.ops .res { font-weight: 600; white-space: nowrap; }
.pie { font-size: var(--f17); color: var(--suave); margin-top: 16px; }   /* son frases: 17 (regla de diseño 5, 26/11) */
.pie p { margin: 6px 0; }
form.cuenta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; }
form.cuenta label { display: block; font-size: var(--f17); margin-bottom: 8px; }
form.cuenta input { width: 100%; min-height: 56px; font-size: var(--f17); padding: 14px; border-radius: 10px; border: 2px solid var(--suave); background: var(--fondo); color: var(--texto); }
/* Los hijos del control se acomodan como hijos de la página: así el botón grande puede quedarse pegado abajo de la
   pantalla mientras su lugar está más abajo de lo que se ve (con la letra grande), y en su lugar cuando se llega a él. */
.control { display: contents; }
.control > :last-child { margin-bottom: 14px; }
/* «Frenar todo» en reposo: chico (ella, 24/11/2026: «frenar más chico»). La zona que responde sigue midiendo 56. El de 88
   queda para el momento de decidir: «Sí, frenar todo» y «Frenar en la bolsa →». */
button.frenito { display: flex; align-items: center; justify-content: flex-start; min-height: 56px; min-width: 56px; padding: 0; border: 0; background: none; font: inherit; }
button.frenito > span { display: inline-flex; align-items: center; min-height: calc(38px * var(--u)); padding: 6px 16px; border-radius: 10px; background: var(--frenar); color: var(--frenar-texto); font-size: var(--f15); font-weight: 700; line-height: 1.2; }
button.frenito:active { box-shadow: none; }
button.frenito:active > span { box-shadow: inset 0 0 0 4px rgba(127, 127, 127, .55); }
/* El botón principal: 88 de alto (regla de diseño 4). Hay uno solo por momento. */
button.frenar, a.bolsa.principal { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 88px; padding: 8px 12px; font: inherit; font-size: var(--f22); font-weight: 700; line-height: 1.2; border: 0; border-radius: 16px; background: var(--frenar); color: var(--frenar-texto); text-align: center; text-decoration: none; margin-top: 10px; }
.control > button.frenar:first-of-type { margin-top: 0; }
.control > a.bolsa.principal { margin-top: 0; }
.control > p.como { margin: 6px 2px 0; color: var(--suave); }
.control > button.frenar, .control > a.bolsa.principal { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 2; box-shadow: 0 0 0 8px var(--fondo); }
button.otro, a.bolsa { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 8px 12px; font: inherit; font-size: var(--f17); font-weight: 700; line-height: 1.2; border: 2px solid var(--suave); border-radius: 12px; background: var(--tarjeta); color: var(--texto); margin-top: 10px; text-align: center; text-decoration: none; }
a.bolsa { border-color: var(--rojo); color: var(--rojo); }
a.bolsa.principal { border: 0; color: var(--frenar-texto); }
/* Cada toque se nota (regla de diseño 10). */
button:active, a.bolsa:active { box-shadow: inset 0 0 0 5px rgba(127, 127, 127, .55); }
.control > button.frenar:active, .control > a.bolsa.principal:active { box-shadow: 0 0 0 8px var(--fondo), inset 0 0 0 5px rgba(127, 127, 127, .55); }
.aviso { border-radius: 14px; padding: 14px; font-size: var(--f17); border: 2px solid; margin-bottom: 10px; }
.aviso p { margin: 4px 0; color: var(--texto); } .aviso .chica { font-size: var(--f17); }
.chica { font-size: var(--f17); }   /* «chica» quedó de nombre: lo que lleva son frases, y van en 17 (regla de diseño 5, 26/11) */
form.cuenta button { margin-top: 12px; width: 100%; min-height: 88px; font-size: var(--f22); font-weight: 700; border: 0; border-radius: 16px; background: var(--frenar); color: var(--frenar-texto); }
/* El gráfico: columnas por día, arriba lo ganado y abajo lo perdido. Cada columna lleva su número escrito. */
.graf { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 8px 10px; margin-bottom: 14px; }
.graf .sub { font-size: var(--f17); color: var(--suave); margin: 0 6px 10px; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.col .mas, .col .menos { display: flex; flex-direction: column; align-items: center; width: 100%; }
.col .mas { justify-content: flex-end; }
.col .menos { justify-content: flex-start; border-top: 1px solid var(--eje); }
.barra { width: min(24px, 56%); }
.mas .barra { background: var(--graf-gana); border-radius: 4px 4px 0 0; }
.menos .barra { background: var(--graf-pierde); border-radius: 0 0 4px 4px; }
.num { font-size: var(--f15); font-weight: 600; color: var(--texto); line-height: 1.35; white-space: nowrap; font-variant-numeric: tabular-nums; }
.col .dia { font-size: var(--f15); color: var(--suave); line-height: 1.2; text-align: center; margin-top: 6px; }
.col.hoy .dia { color: var(--texto); font-weight: 700; }
/* CADA DÍA SE TOCA (24/11/2026): la columna entera es el botón (56 o más de ancho: por eso entran menos días). El elegido
   lleva marco, no sólo color. Abajo se abre su detalle: por mercado, cómo cerró, comisiones y la ganancia hora por hora. */
button.col { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; padding: 2px 0 4px; background: none; border: 2px solid transparent; border-radius: 10px; font: inherit; color: inherit; text-align: center; cursor: pointer; }
button.col span { display: block; }
button.col[aria-pressed="true"] { border-color: var(--texto); background: var(--gris-fondo); }
.graf .toca { font-size: var(--f17); color: var(--suave); margin: 10px 6px 0; }
.det { margin: 12px 4px 0; padding-top: 10px; border-top: 1px solid var(--borde); }
.det h3 { font-size: var(--f17); margin: 0 2px 6px; }
.det p { margin: 6px 2px 0; }
.det ul.ops { border: 0; border-radius: 0; background: none; }
.det ul.ops li { padding: 9px 2px; }
.det ul.ops .que { color: var(--texto); }
.det .rot { font-size: var(--f15); color: var(--suave); margin: 12px 2px 0; }
.horas { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 6px 2px 0; }
.hcol { display: flex; flex-direction: column; min-width: 0; }
.hcol .mas, .hcol .menos { display: flex; flex-direction: column; align-items: center; width: 100%; }
.hcol .mas { justify-content: flex-end; }
.hcol .menos { justify-content: flex-start; border-top: 1px solid var(--eje); }
.hcol .barra { width: 70%; }
.heje { display: grid; grid-template-columns: repeat(4, 1fr); margin: 2px 2px 0; font-size: var(--f15); color: var(--suave); }
.sonido { margin-bottom: 14px; }
.sonido p { margin: 0 2px; color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>EL MOTOR</h1>
  <div id="app"></div>
</main>
<script>
// Lee la cuenta en la API pública de Hyperliquid (la misma que usa su página). No tiene clave ni puede mandar órdenes.
// La dirección de la cuenta viaja en el enlace después de «#» (no se manda a ningún servidor ni queda escrita acá).
// EL BOTÓN «FRENAR TODO» (23/11/2026): si el enlace trae además «canal=», la página puede pedirle a la PC que frene
// (motor/control.mjs). Publica una palabra en ese canal privado de ntfy.sh; la PC saca las órdenes, cierra lo abierto y
// contesta por el mismo canal. No puede encender nada ni mover plata. El canal tampoco queda escrito acá.
// 24/11/2026: la letra sigue a la del teléfono, lo que se lee de corrido va en tinta oscura, el gráfico de la ganancia por día, y
// una campanita cuando la ganancia de hoy llega a un dólar más.
const API = 'https://api.hyperliquid.xyz/info', NTFY = 'https://ntfy.sh', BOLSA = 'https://app.hyperliquid.xyz/trade';
const DEXES = ['io', 'xyz'];
// 26/11/2026: el tope total es −45 (desde el 25/11) y el de órdenes se cuenta POR MERCADO (el motor opera hasta 6 a la
// vez): 3 filas por lado y la salida. Los frenos puestos en la bolsa no cuentan.
const TOPE_DIA = 10, TOPE_TOTAL = 45, POSICION_MAX = 605, ORDENES_MAX = 7;
const app = document.getElementById('app');
const zona = { timeZone: 'America/Argentina/Buenos_Aires' };
const usd = (x) => (x <= -0.005 ? '−' : x >= 0.005 ? '+' : '') + Math.abs(x).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const plano = (x) => x.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
const clase = (x) => (x > 0.005 ? 'gana' : x < -0.005 ? 'pierde' : '');
const hora = (t) => new Date(t).toLocaleTimeString('es-AR', { ...zona, hour: '2-digit', minute: '2-digit', hour12: false });
const haceCuanto = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.floor(m / 60)} h ${m % 60} min` : `hace ${Math.floor(m / 1440)} días`; };
const el = (tag, attrs = {}, ...hijos) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); for (const h of hijos) e.append(h); return e; };
const diaDe = (t) => new Date(t - 3 * 3600e3).toISOString().slice(0, 10);   // el día de Buenos Aires
const inicioDe = (d) => Date.parse(d + 'T03:00:00Z');
const netoDe = (f) => +f.closedPnl - +f.fee;

// La letra del teléfono: cuántas veces la normal (17), entre 14/17 y el doble.
function medirLetra() {
  let px = 17; try { px = parseFloat(getComputedStyle(document.documentElement).fontSize) || 17; } catch { /* queda en 17 */ }
  const u = Math.round(Math.max(14 / 17, Math.min(2, px / 17)) * 1000) / 1000;
  document.documentElement.style.setProperty('--u', String(u));
  return u;
}
let U = medirLetra();

function leerCuenta() {
  const p = new URLSearchParams(location.hash.slice(1));
  const c = (p.get('cuenta') || '').toLowerCase();
  if (/^0x[0-9a-f]{40}$/.test(c)) { try { localStorage.setItem('cuenta', c); } catch {} return c; }
  try { const g = localStorage.getItem('cuenta'); if (g && /^0x[0-9a-f]{40}$/.test(g)) return g; } catch {}
  return null;
}
async function pedir(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
  if (!r.ok) throw new Error('la bolsa contestó ' + r.status);
  return r.json();
}
function inicioDelDia() { return inicioDe(diaDe(Date.now())); }

function pedirCuenta() {
  app.replaceChildren();
  const input = el('input', { id: 'dir', inputmode: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '0x…' });
  const f = el('form', { class: 'cuenta' }, el('label', { for: 'dir' }, 'Pegá la dirección de tu cuenta de Hyperliquid'), input, el('button', { type: 'submit' }, 'Ver mi cuenta'));
  f.addEventListener('submit', (e) => { e.preventDefault(); const c = input.value.trim().toLowerCase(); if (/^0x[0-9a-f]{40}$/.test(c)) { location.hash = 'cuenta=' + c; arrancar(); } else input.focus(); });
  app.append(f);
}

// ---------- el control: preguntarle a la PC y frenar ----------
function leerCanal() {
  const ok = (c) => /^[A-Za-z0-9_-]{32,64}$/.test(c || '');
  const c = new URLSearchParams(location.hash.slice(1)).get('canal');
  if (ok(c)) { try { localStorage.setItem('canal', c); } catch {} return c; }
  try { const g = localStorage.getItem('canal'); if (ok(g)) return g; } catch {}
  return null;
}
const control = el('div', { class: 'control' });
// ---------- las luces: tres botones chicos (el motor, la PC y Claude) ----------
// 24/11/2026, a pedido de ella: en lugar del cartel grande y de la tarjeta de la PC, un botón chico por cosa. Verde es «en
// orden». Tocás uno y abre su detalle (lo mismo que antes se leía en el cartel); lo rojo se abre solo. El color nunca va
// solo: cada uno lleva su palabra y su signo.
const luces = el('div', { class: 'luces' }), luzdet = el('div', {});
const L = { motor: null, pc: null, claude: null, abierta: null };   // cada una: { tipo, corto, titulo, texto: [], tranqui, atencion }
const SIGNO = { ok: '✔', ojo: '!', alto: '✖', nada: '…' };
function pintarLuces() {
  const cuales = ['motor', 'pc', 'claude'].filter((k) => L[k]);
  const abierta = (k) => !!L[k].atencion || L.abierta === k;
  luces.replaceChildren(...cuales.map((k) => {
    const b = el('button', { class: 'luz', type: 'button', 'aria-expanded': String(abierta(k)) }, el('span', { class: L[k].tipo }, SIGNO[L[k].tipo] + ' ' + L[k].corto));
    b.addEventListener('click', () => { L.abierta = L.abierta === k ? null : k; pintarLuces(); });
    return b;
  }));
  luzdet.replaceChildren(...cuales.filter(abierta).map((k) => {
    const x = L[k], mas = x.tranqui && !hayQueFrenarEnLaBolsa() ? ['No hace falta hacer nada.'] : [];
    return el('div', { class: 'luzdet ' + x.tipo, role: 'status' }, el('div', { class: 'tit' }, x.titulo), ...x.texto.concat(mas).map((t) => el('p', {}, t)));
  }));
}
const C = { pc: 'nada', r: null, cuando: 0, paso: 'listo', res: null, enviado: 0, confirmarDesde: 0 };   // pc: nada | preguntando | contesta | callada · paso: listo | confirmar | esperando | hecho | sin-respuesta | sin-enviar
const sena = () => Math.random().toString(36).slice(2, 10);
async function publicar(canal, texto) {
  const r = await fetch(NTFY + '/' + canal, { method: 'POST', body: texto, cache: 'no-store' });
  if (!r.ok) throw new Error('el canal contestó ' + r.status);
}
async function esperarRespuesta(canal, que, id, segundos) {
  const fin = Date.now() + segundos * 1000;
  while (Date.now() < fin) {
    await esperar(2500);
    try {
      const r = await fetch(NTFY + '/' + canal + '/json?poll=1&since=3m', { cache: 'no-store' });
      for (const l of (await r.text()).split('\n')) { if (!l.trim()) continue; let e; try { e = JSON.parse(l); } catch { continue; } const m = String(e.message || ''); if (e.event !== 'message' || !m.startsWith('r:')) continue; let o; try { o = JSON.parse(m.slice(2)); } catch { continue; } if (o.que === que && o.id === id) return o; }
    } catch { /* sin señal: sigue probando */ }
  }
  return null;
}
let preguntando = false;
async function preguntarPC() {
  const canal = leerCanal(); if (!canal || preguntando) { pintarControl(); return; }
  preguntando = true; if (C.pc !== 'contesta') C.pc = 'preguntando'; pintarControl();
  const id = sena(); let r = null;
  try { await publicar(canal, 'estado ' + id); r = await esperarRespuesta(canal, 'estado', id, 25); } catch { /* sin señal */ }
  C.pc = r ? 'contesta' : 'callada'; C.r = r; C.cuando = Date.now(); preguntando = false; pintarControl();
  if (ultimoDato) pintar(ultimoDato);   // 26/11: lo que dice la PC de cada mercado se ve en el momento, no un minuto después
}
async function frenarTodo() {
  const canal = leerCanal(); if (!canal) return;
  if (Date.now() - C.confirmarDesde < 700) return;   // un segundo toque seguido, sobre el mismo lugar, no confirma (regla de diseño 4)

// «Frenar en la bolsa». Chico, dentro de una tarjeta; o grande y suelto, cuando es lo que hay que tocar (la PC no contesta

const COMO_BOLSA = 'Entrás con tu correo. Abajo: «Positions» (lo abierto) → «Close All» (cerrar todo), y «Open Orders» (las órdenes) → «Cancel All» (sacar todas).';

const hayQueFrenarEnLaBolsa = () => C.pc === 'callada' || C.paso === 'sin-respuesta' || C.paso === 'sin-enviar' || (C.paso === 'hecho' && !!C.res && !C.res.ok);

// ---------- el sonido: una campanita cuando la ganancia de hoy llega a un dólar más ----------
// En la web no suena nada hasta el primer toque, y el iPhone en silencio la calla: por eso lo mismo queda escrito en la
// tarjeta «Ganancia de hoy» (el sonido nunca es la única señal). Tres notas que suben, cortas y suaves (medio segundo).
let audio = null, sonidoQuiere = true, sonidoPendiente = false;
try { sonidoQuiere = localStorage.getItem('sonido') !== 'no'; } catch { /* sin almacenamiento: queda prendido */ }
const sonidoListo = () => !!audio && audio.state === 'running';
function campanita(ctx, destino, t0) {
  const salida = ctx.createGain(); salida.gain.value = 0.2; salida.connect(destino);
  for (const [f, dt] of [[783.99, 0], [1046.5, 0.1], [1318.51, 0.2]]) {   // sol, do, mi: un acorde mayor que sube

    g.gain.value = 0; g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(1, a + 0.02); g.gain.exponentialRampToValueAtTime(0.001, a + 0.36);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(salida);

// Hasta qué dólar entero llegó hoy lo ganado y cerrado, y a qué hora. Suena una vez por cada dólar nuevo del día.
function dolarArriba(deHoy, dia) {
  let suma = 0, nivel = 0, cuando = 0;
  for (const f of deHoy) { suma += netoDe(f); const k = Math.floor(suma + 1e-9); if (k > nivel) { nivel = k; cuando = f.time; } }

  if (nivel > visto.nivel) { try { localStorage.setItem('dolar', JSON.stringify({ dia, nivel })); } catch {} sonar(); }
  return { nivel, cuando };
}

// LA PÁGINA LEE POCO (24/11): la bolsa cuenta las lecturas por conexión, y en casa el celu comparte la conexión con los
// programas del motor. Con el celu abierto los programas recibían rechazos (429). Por eso: se actualiza una vez por minuto,
// las órdenes puestas se miran cada dos minutos, y si la bolsa pide esperar, la página espera dos minutos sin insistir.
const CADA_MS = 60000, ORDENES_CADA_MS = 110000, ESPERA_429_MS = 120000;

// y otra. Si no ve ninguna, mira dos veces más; y recuerda la última vez que vio órdenes puestas (20/11).
let ordenVista = 0;
try { ordenVista = Number(localStorage.getItem('ordenVista')) || 0; } catch { /* sin almacenamiento: empieza en 0 */ }

// ---------- las operaciones, de a poco, y el libro de los días ----------
// La bolsa da como mucho 2.000 operaciones por pedido, en orden desde la hora pedida: las más nuevas no vienen (24/11).
// Por eso: (1) se lee por páginas; (2) los días ya terminados se guardan en el teléfono, sumados («el libro»), y al abrir
// sólo se lee desde el principio de hoy; (3) después, cada 30 s, sólo lo nuevo. Así la ganancia total y el gráfico no se
// quedan ciegos al pasar las 2.000, y cada lectura pesa poco (el límite de lecturas de la bolsa es por conexión).
let fillsMem = null, base = null, completo = true;   // base: { hasta, dias: { 'AAAA-MM-DD': [neto, operaciones] }, ult: [las últimas, por si hoy no hay] }
const claveLibro = (cuenta) => 'libro1:' + cuenta;
function cargarLibro(cuenta) {
  try { const g = JSON.parse(localStorage.getItem(claveLibro(cuenta)) || 'null'); if (g && g.hasta > 0 && g.dias && typeof g.dias === 'object') return { hasta: g.hasta, dias: g.dias, ult: Array.isArray(g.ult) ? g.ult : [] }; } catch { /* empieza de cero */ }

}
// Las operaciones desde una hora (y, si se pide, hasta otra), por páginas. «entero» dice si llegó a leer todas.
async function traerEntre(cuenta, desde, hasta = 0) {
  const out = [], vistas = new Set(); let cursor = desde, entero = false;
  for (let pag = 0; pag < 30; pag++) {
    const f = await pedir(hasta ? { type: 'userFillsByTime', user: cuenta, startTime: cursor, endTime: hasta } : { type: 'userFillsByTime', user: cuenta, startTime: cursor });
    if (!Array.isArray(f)) break;

    for (const x of f) { if (x.time > max) max = x.time; if (!vistas.has(x.tid)) { vistas.add(x.tid); out.push(x); } }

}
async function traerDesde(cuenta, desde) {
  const r = await traerEntre(cuenta, desde);

}
async function leerFills(cuenta) {
  if (!fillsMem) { base = cargarLibro(cuenta); completo = true; fillsMem = await traerDesde(cuenta, base.hasta); return fillsMem; }
  const desde = fillsMem.reduce((m, f) => Math.max(m, f.time), base.hasta);

}
// Los días, sumados: los del libro más lo leído en esta apertura. Devuelve un Map en orden de fecha.
function sumarDias(fills) {
  const dias = new Map(Object.entries(base?.dias || {}).map(([d, v]) => [d, { g: +v[0] || 0, n: +v[1] || 0 }]));
  for (const f of fills) { const d = diaDe(f.time); if (!dias.has(d)) dias.set(d, { g: 0, n: 0 }); const x = dias.get(d); x.g += netoDe(f); x.n++; }
  return new Map([...dias].sort((a, b) => (a[0] < b[0] ? -1 : 1)));
}
function guardarLibro(cuenta, dias, ultimas, hoy) {
  if (!completo) return;
  const cerrados = {}; for (const [d, v] of dias) if (d < hoy) cerrados[d] = [Math.round(v.g * 1e6) / 1e6, v.n];
  const ult = ultimas.map((f) => ({ time: f.time, tid: f.tid, coin: f.coin, side: f.side, px: f.px, sz: f.sz, closedPnl: f.closedPnl, fee: f.fee, crossed: !!f.crossed }));

}
async function actualizar(cuenta) {
  if (ocupado || Date.now() < esperaHasta) return; ocupado = true;

    // El motor opera en dos bolsas chicas (io y xyz): se leen las dos y se juntan.
    // frontendOpenOrders (24/11): pesa lo mismo que openOrders y dice cuáles son frenos en la bolsa (isTrigger) y cuál
    // es la salida (reduceOnly), así «Qué está haciendo» no las cuenta como órdenes para entrar.
    const leerOrdenes = async () => (await Promise.all(DEXES.map((dex) => pedir({ type: 'frontendOpenOrders', user: cuenta, dex })))).flatMap((x) => (Array.isArray(x) ? x : []));
    const tocaOrdenes = Date.now() - ordenesT >= ORDENES_CADA_MS;
    let [perps, spot, ordenes, fills] = await Promise.all([
      Promise.all(DEXES.map((dex) => pedir({ type: 'clearinghouseState', user: cuenta, dex }))),

    if (tocaOrdenes && !ordenes.length && Date.now() - ordenVista < 3 * 60000) { await esperar(1500); ordenes = await leerOrdenes(); }

// ---------- el gráfico: la ganancia de cada día, en columnas ----------
const corto = (x) => { const a = Math.round(Math.abs(x) * 100) / 100; if (a < 0.005) return '0'; return (x < 0 ? '−' : '+') + a.toLocaleString('es-AR', a < 10 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : a < 100 ? { minimumFractionDigits: 1, maximumFractionDigits: 1 } : { maximumFractionDigits: 0 }); };
const diaLargo = (d) => new Date(inicioDe(d) + 12 * 3600e3).toLocaleDateString('es-AR', { ...zona, weekday: 'long' }) + ' ' + +d.slice(8) + '/' + +d.slice(5, 7);
const diaCorto = (d) => new Date(inicioDe(d) + 12 * 3600e3).toLocaleDateString('es-AR', { ...zona, weekday: 'short' }).replace('.', '');
// ---------- el detalle de un día: se toca su columna ----------
// Hoy sale de lo recién leído. Un día terminado se lee de la bolsa una sola vez (sus operaciones, por páginas) y su
// resumen queda guardado en el teléfono («detalle1:<cuenta>»): un día cerrado no cambia, y así no se gastan lecturas.
let diaElegido = null, grafAhora = null;   // grafAhora: con qué se dibujó el gráfico la última vez (para redibujarlo al tocar)

const claveDet = (cuenta) => 'detalle1:' + cuenta;
const mercadoDe = (coin) => (String(coin).startsWith('#') ? 'Outcome' : String(coin).split(':').pop());
function resumir(fills) {
  const r = { n: 0, g: 0, com: 0, vol: 0, dej: 0, tom: 0, nTom: 0, mer: {}, horas: Array(24).fill(0) };
  for (const f of fills) {
    const neto = netoDe(f), m = mercadoDe(f.coin);
    r.n++; r.g += neto; r.com += +f.fee; r.vol += +f.px * +f.sz;
    if (f.crossed) { r.tom += neto; r.nTom++; } else r.dej += neto;
    const x = (r.mer[m] ??= [0, 0]); x[0] += neto; x[1]++;
    r.horas[new Date(f.time - 3 * 3600e3).getUTCHours()] += neto;
  }
  return r;
}
function detalleGuardado(cuenta, d) {
  try { const g = JSON.parse(localStorage.getItem(claveDet(cuenta)) || 'null'); const x = g && g[d]; if (x && x.n >= 0 && Array.isArray(x.horas) && x.horas.length === 24 && x.mer) return x; } catch { /* se lee de nuevo */ }
  return null;
}
function guardarDetalle(cuenta, d, det) {
  const r4 = (x) => Math.round(x * 1e4) / 1e4;
  try {
    const g = JSON.parse(localStorage.getItem(claveDet(cuenta)) || 'null') || {};
    g[d] = { n: det.n, g: r4(det.g), com: r4(det.com), vol: Math.round(det.vol), dej: r4(det.dej), tom: r4(det.tom), nTom: det.nTom, mer: Object.fromEntries(Object.entries(det.mer).map(([m, v]) => [m, [r4(v[0]), v[1]]])), horas: det.horas.map(r4) };
    localStorage.setItem(claveDet(cuenta), JSON.stringify(g));
  } catch { /* sin lugar: la próxima vez se lee de nuevo */ }
}
function detalleDe(cuenta, d, hoy) {
  const delDia = () => resumir((fillsMem || []).filter((f) => diaDe(f.time) === d));
  if (d === hoy) return delDia();
  if (detMem.has(d)) return detMem.get(d);
  const det = (base && completo && base.hasta <= inicioDe(d)) ? delDia() : detalleGuardado(cuenta, d);   // ya está en lo leído al abrir, o guardado
  if (det) detMem.set(d, det);

}
async function leerDetalle(cuenta, d) {
  const pideEsperar = () => ({ error: `La bolsa pidió esperar. Tocá el día de nuevo después de las ${hora(esperaHasta)}.` });
  if (Date.now() < esperaHasta) { detMem.set(d, pideEsperar()); repintarGrafico(); return; }
  detMem.set(d, { leyendo: true }); repintarGrafico();
  try {
    const r = await traerEntre(cuenta, inicioDe(d), inicioDe(d) + 86400e3 - 1);
    const det = resumir(r.fills.filter((f) => diaDe(f.time) === d));
    if (r.entero) guardarDetalle(cuenta, d, det); else det.faltan = true;
    detMem.set(d, det);
  } catch (e) {
    if (/429/.test(String(e && e.message))) { esperaHasta = Date.now() + ESPERA_429_MS; detMem.set(d, pideEsperar()); }
    else detMem.set(d, { error: 'No pude leer ese día: el celu no llega a la bolsa. Tocá el día de nuevo para probar otra vez.' });
